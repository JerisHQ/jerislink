name: msstore-publish-check

# Dry run of msstore-publish.yml without Partner Center: no `store` environment,
# no secrets, no network to Microsoft. It takes the jerislink-msix-store artifact
# of the newest successful `msix` push run on main (or the given run) and:
# - checks the publish job in msstore-publish.yml: no Store CLI; sign-in, then
#   Publish-StoreSubmission, then the read-back (Assert-SubmissionHasPackage) on
#   the submission id the publish step returned; default API and sign-in hosts;
#   and that the package is printed from an `inspect` job outside the `store`
#   environment (and without secrets), so the approver sees it before approving.
# - runs that flow with the real package over real HTTP against a stand-in for
#   the Store API and the blob upload on 127.0.0.1 (tests/FakeStoreApi.psm1,
#   allowed only through Connect-StoreApi -LoopbackTestServer): the calls and
#   their order, every call after create on the created id, the uploaded zip
#   (only the package, same SHA-256), no DELETE, the read-back, and no token,
#   secret or SAS URL in any output stream with verbose and debug output on.
#   Also: a pending submission stops the run before create; a PUT that changes
#   the pricing stops it uncommitted; without -LoopbackTestServer nothing is
#   sent to the stand-in.
# - checks sign-in and the pending check fail closed on a dead port (127.0.0.1:9).
# The stand-in only models what the module relies on; the real service's JSON
# shapes, status changes and upload are not verified here.
# The `pester` job runs .github/scripts/tests (the same flow with a mocked HTTP
# layer, the draft check, the field comparison, the read-back, unconfirmed
# create and commit, URL rules, redirects, fixed error text, pricing and
# delete-by-id).

on:
  pull_request:
    paths:
      - .github/workflows/msstore-publish.yml
      - .github/workflows/msstore-publish-check.yml
      - .github/scripts/MsStoreRunner.psm1
      - .github/scripts/tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/msstore-publish.yml
      - .github/workflows/msstore-publish-check.yml
      - .github/scripts/MsStoreRunner.psm1
      - .github/scripts/tests/**
  workflow_dispatch:
    inputs:
      msix_run_id:
        description: 'Run id of a successful "msix" push run (default: newest on main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  STORE_PRODUCT_ID: 9NM3VWQ9MD7N
  EXPECTED_IDENTITY_NAME: jerisHQ.JerisLink
  EXPECTED_PUBLISHER: CN=89A018EB-5C52-49CB-B478-B462FA6B08DD

jobs:
  pester:
    # Unit tests: .github/scripts/tests.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Run Pester
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
            $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' } | Select-Object -First 1
          }
          Import-Module $pester.Path -Force
          Write-Host "PowerShell $($PSVersionTable.PSVersion), Pester $($pester.Version)"
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.github/scripts/tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.Result -ne 'Passed' -or $r.PassedCount -lt 1) { throw "Pester: $($r.Result), $($r.FailedCount) failed, $($r.PassedCount) passed" }

  dry-run:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Check the publish job in msstore-publish.yml
        run: |
          $wf = Get-Content .github/workflows/msstore-publish.yml -Raw
          $code = ($wf -split "`n" | Where-Object { $_.TrimStart() -notlike "#*" }) -join "`n"
          if ($code -match '(?m)^\s*msstore\s|microsoft-store-apppublisher|STORE_CLI_VERSION') { throw "msstore-publish.yml still uses the Store CLI" }
          if ($code -match '-ApiBase|-AuthorityHost|-LoopbackTestServer') { throw "msstore-publish.yml must use the default Store API and sign-in hosts" }
          $connect = 'Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET'
          $steps = @(
            $connect,
            'Publish-StoreSubmission -ProductId $env:STORE_PRODUCT_ID -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION',
            $connect,
            'Assert-SubmissionHasPackage -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID -ExpectedVersion $env:EXPECTED_VERSION'
          )
          $at = -1
          foreach ($st in $steps) {
            $i = $code.IndexOf($st, $at + 1)
            if ($i -lt 0) { throw "msstore-publish.yml does not run (in this order): $st" }
            $at = $i
          }
          if (([regex]::Matches($code, 'Publish-StoreSubmission ')).Count -ne 1) { throw "msstore-publish.yml must run Publish-StoreSubmission exactly once" }
          if ($code -notmatch 'SUBMISSION_ID: \$\{\{ steps\.submit\.outputs\.submission_id \}\}') { throw "the read-back does not use the submission id the publish step returned" }
          if ($code -notmatch 'PKG_NAME: \$\{\{ needs\.inspect\.outputs\.file_name \}\}') { throw "the publish step does not check the file name inspect showed" }
          # The approver must see the package before approving: the job that
          # prints it must not be in the store environment or see its secrets.
          $inspect = [regex]::Match($wf, '(?ms)^  inspect:\s*\n(?:(?!^  \S).)*').Value
          if ($inspect -notmatch 'Package to publish after approval') { throw "inspect job does not print the package before approval" }
          if ($inspect -match '(?m)^\s+environment:' -or $inspect -match 'secrets\.') { throw "inspect job must not use an environment or secrets" }
          if ($wf -notmatch '(?ms)^  publish:\s*\n(?:(?!^  \S).)*?^\s+needs: inspect\s*$(?:(?!^  \S).)*?^\s+environment: store\s*$') { throw "publish job must need inspect and run in the store environment" }
          Write-Host "msstore-publish.yml: publish job order and package gate OK"

      - name: Find the msix run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.msix_run_id }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          if ($env:RUN_ID) {
            if ($env:RUN_ID -notmatch '^\d+$') { throw "msix_run_id must be a number" }
            $run = gh api "repos/$repo/actions/runs/$env:RUN_ID" | ConvertFrom-Json
            if ($run.name -ne 'msix' -or $run.event -ne 'push' -or $run.conclusion -ne 'success') { throw "not a successful msix push run" }
          } else {
            $run = @((gh api "repos/$repo/actions/workflows/msix.yml/runs?branch=main&event=push&status=success&per_page=1" | ConvertFrom-Json).workflow_runs)[0]
            if (-not $run) { throw "no successful msix push run on main" }
          }
          $sha = $run.head_sha
          $v = gh api "repos/$repo/contents/VERSION?ref=$sha" --jq .content
          $version = ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($v -join '')).Split("`n")[0].Trim()) + '.0'
          Write-Host "msix run $($run.id): event=$($run.event) ref=$($run.head_branch) sha=$sha -> expected package version $version"
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the Store package artifact
        uses: actions/download-artifact@v4
        with:
          name: jerislink-msix-store
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store

      - name: Check the package identity and version
        id: pkg
        env:
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
        run: |
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'store') | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          $p = Get-StorePackage -Dir (Join-Path $env:RUNNER_TEMP 'store') -ExpectedName $env:EXPECTED_IDENTITY_NAME `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER -ExpectedVersion $env:EXPECTED_VERSION
          if ($p.Version -ne $env:EXPECTED_VERSION) { throw "Get-StorePackage returned Version $($p.Version)" }
          if ($p.FileName -ne (Split-Path -Leaf $p.Path) -or $p.Sha256 -notmatch '^[0-9a-f]{64}$') { throw "Get-StorePackage returned unexpected FileName/Sha256" }
          Write-Host "PKG_FILE=$($p.Path) Version=$($p.Version) SHA256=$($p.Sha256)"
          "file=$($p.Path)" >> $env:GITHUB_OUTPUT
          "file_name=$($p.FileName)" >> $env:GITHUB_OUTPUT
          "sha256=$($p.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Dry run of the publish flow against a local stand-in for the Store API
        timeout-minutes: 8
        env:
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ steps.pkg.outputs.file_name }}
          PKG_SHA256: ${{ steps.pkg.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
        run: |
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Import-Module ./.github/scripts/tests/FakeStoreApi.psm1
          $secret = 'dry-run-secret-' + [guid]::NewGuid().ToString('N')
          # Runs a command with verbose and debug output on, shows what it
          # printed (Write-Host), returns value, text of every stream and error.
          # Verbose and debug records are counted, not shown: none may describe
          # a request (PowerShell 7.6 writes URL, headers and body there).
          function Invoke-Shown([scriptblock]$b) {
            $printed = [Collections.Generic.List[string]]::new(); $value = @(); $err = ''; $noisy = 0
            $saved = $global:VerbosePreference, $global:DebugPreference
            try {
              $global:VerbosePreference = 'Continue'; $global:DebugPreference = 'Continue'
              $value = @(& $b *>&1 | ForEach-Object {
                if ($_ -is [Management.Automation.InformationRecord]) { $printed.Add([string]$_.MessageData); Write-Host "  | $($_.MessageData)" }
                elseif ($_ -is [Management.Automation.VerboseRecord] -or $_ -is [Management.Automation.DebugRecord] -or $_ -is [Management.Automation.WarningRecord]) {
                  $printed.Add("$_"); if ("$_" -match 'HTTP/|payload|https?://|Bearer|client_secret|sig=') { $noisy++ } }
                else { $_ } })
            } catch { $err = "$_"; Write-Host "  ! $err" }
            finally { $global:VerbosePreference, $global:DebugPreference = $saved }
            if ($noisy) { throw "$noisy verbose or debug record(s) describe a request" }
            [pscustomobject]@{ Value = $value; Text = (($printed -join "`n") + "`n" + $err); Err = $err }
          }
          function Assert-NoLeak([string]$text, $store) {
            foreach ($bad in @($secret, $store.Token, 'FAKE+SAS', 'FAKE%2BSAS', 'SIGNATURE-0123456789', '/blob/')) {
              if ($text.Contains($bad)) { throw "output contains a secret, token or SAS URL part" }
            }
          }
          $app = $env:STORE_PRODUCT_ID
          $base = "/v1.0/my/applications/$app"

          # 1. The whole flow with the real package, over HTTP.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION
          $url = Start-FakeStoreServer -Store $s
          try {
            $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer }
            if ($r.Err) { throw "sign-in to the stand-in failed" }
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err) { throw "publish flow failed against the stand-in" }
            Assert-NoLeak $r.Text $s
            if ($r.Text -notmatch 'fields unchanged: \d+ submission fields') { throw "the fields were not compared before commit" }
            $id = $s.NewId
            if (@($r.Value) -join ',' -ne $id) { throw "Publish-StoreSubmission returned '$(@($r.Value) -join ',')', not $id" }
            $want = @("POST /tenant-dry-run/oauth2/v2.0/token", "GET $base", "POST $base/submissions", "GET $base", "GET $base/submissions/$id",
                      "PUT $base/submissions/$id", "PUT /blob/upload.zip", "GET $base/submissions/$id", "POST $base/submissions/$id/commit")
            $got = @($s.Log)
            Write-Host "calls:`n  $($got -join "`n  ")"
            if (($got -join "`n") -cne ($want -join "`n")) { throw "the calls differ from the expected flow" }
            if ($s.BlobHeaders['x-ms-blob-type'] -cne 'BlockBlob' -or $s.BlobHeaders['Content-Type'] -cne 'application/zip') { throw "upload headers are wrong" }
            $z = @(Get-FakeUploadedZip $s)
            if ($z.Count -ne 1 -or $z[0].Name -cne $env:PKG_NAME) { throw "the uploaded zip must hold only $env:PKG_NAME at its root" }
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([byte[]]$z[0].Bytes)).ToLower()
            if ($sha -ne $env:PKG_SHA256) { throw "the uploaded package differs from the checked one" }
            Write-Host "uploaded zip: $($z[0].Name) SHA256=$sha (same as the checked package)"
            $r = Invoke-Shown { Assert-SubmissionHasPackage -ProductId $app -SubmissionId $id -ExpectedVersion $env:EXPECTED_VERSION -TimeoutMinutes 0 -IntervalSeconds 0 }
            if ($r.Err) { throw "read-back failed against the stand-in" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 2. A pending submission the run did not create: stop before create, delete nothing.
          $s = New-FakeStore -AppId $app -PendingId '1152921505000000007'
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err -notmatch "already has a pending submission 1152921505000000007" -or $r.Err -notmatch "DELETE $([regex]::Escape($base))/submissions/1152921505000000007 ") { throw "pending submission did not stop the run with delete-by-id guidance" }
            if ((@($s.Log) -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base") { throw "calls after the pending check: $(@($s.Log) -join ', ')" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 3. Dead port: sign-in and the pending check fail closed, with fixed text.
          $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost 'http://127.0.0.1:9' -ApiBase 'http://127.0.0.1:9' -LoopbackTestServer }
          if ($r.Err -notmatch '^could not get a Partner Center access token: no response \(' -or $r.Text.Contains($secret)) { throw "sign-in on a dead port did not fail closed with fixed text" }
          $s = New-FakeStore -AppId $app
          $url = Start-FakeStoreServer -Store $s
          try { Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase 'http://127.0.0.1:9' -LoopbackTestServer } | Out-Null }
          finally { Stop-FakeStoreServer -Store $s }
          $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
          if ($r.Err -notmatch "Store API GET /v1\.0/my/applications/$app failed: no response \(.*cannot check for a pending submission; not publishing") { throw "pending check on a dead port did not fail closed" }
          Assert-NoLeak $r.Text $s

          # 4. The PUT changes the pricing: stop uncommitted, delete-by-id guidance, no commit.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -DriftOnPut Pricing
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err -notmatch "submission fields changed after this run's update: pricing\." -or $r.Err -notmatch "DELETE $([regex]::Escape($base))/submissions/$($s.NewId) ") { throw "a pricing change did not stop the run uncommitted with delete-by-id guidance" }
            if (@($s.Log) -contains "POST $base/submissions/$($s.NewId)/commit") { throw "committed after a pricing change" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 5. Without -LoopbackTestServer nothing goes to the stand-in.
          $s = New-FakeStore -AppId $app
          $url = Start-FakeStoreServer -Store $s
          try {
            $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url }
            if ($r.Err -notmatch '^refused: ' -or @($s.Log).Count -ne 0) { throw "a loopback stand-in was used without -LoopbackTestServer" }
          } finally { Stop-FakeStoreServer -Store $s }
          Write-Host "dry run: all assertions passed"
