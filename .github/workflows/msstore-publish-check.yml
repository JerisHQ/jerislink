name: msstore-publish-check

# Dry run of msstore-publish.yml without Partner Center: no `store` environment,
# no secrets, no network to Microsoft. It takes the jerislink-msix-store artifact
# of the newest successful `msix` push run on main (or the given run) and:
# - checks the publish job in msstore-publish.yml: no Store CLI; sign-in, then
#   Publish-StoreSubmission, then the read-back (Assert-SubmissionHasPackage) on
#   the submission id the publish step returned; default API and sign-in hosts;
#   and that the package is printed from an `inspect` job outside the `store`
#   environment (and without secrets), so the approver sees it before approving;
#   that the publish step sets its deadline first, at least 2 min before its
#   timeout, and passes it on; and that every step of the publish job has a
#   timeout and they add up to at most the job's; that the diagnose job runs
#   only on a manual run from main with mode=diagnose, in the store
#   environment, checks submission_id before the sign-in and then runs only
#   Show-StoreSubmissionDiagnosis; that the delete-draft job runs only on a
#   manual run from main with mode=delete-draft, in the store environment,
#   sets its deadline at least 1 min before its timeout, checks submission_id
#   before the sign-in and then runs only Remove-StorePendingDraft with that
#   deadline; and that inspect (so publish) does not run for mode=diagnose or
#   mode=delete-draft.
# - runs that flow with the real package over real HTTP against a stand-in for
#   the Store API and the blob upload on 127.0.0.1 (tests/FakeStoreApi.psm1,
#   allowed only through Connect-StoreApi -LoopbackTestServer): the calls and
#   their order, every call after create on the created id, the uploaded zip
#   (only the package, same SHA-256), no DELETE, the read-back, and no token,
#   secret or SAS URL in any output stream with verbose and debug output on.
#   The stand-in renames the draft and rearranges its pricing on the PUT as
#   the real Store does (run 45524510567), and the flow still commits.
#   Also: a pending PendingCommit draft stops the run before create, names
#   the draft, says a person decides and sends it nothing; a PUT that changes
#   the price stops it uncommitted and names the path; no output shows a price; a commit that gets a 504 while still
#   processing is read back by id until it shows CommitStarted; a draft someone
#   else creates after the pending check, with a create that gets a 504, is
#   reported as of unconfirmed origin with no delete advice; a commit that
#   never answers prints the id before it is sent and "result unconfirmed"
#   before the first read-back, then stops unconfirmed; a read of the new
#   submission before its update answered HTTP 202, with a token, a secret
#   and a SAS URL in its body, stops it uncommitted with "Could not verify",
#   look-by-id only, no delete or re-run advice and none of that body
#   printed; without -LoopbackTestServer nothing is sent to the stand-in;
#   mode=diagnose (Show-StoreSubmissionDiagnosis) sends only GET requests
#   after the sign-in, changes nothing and prints field paths, not values;
#   mode=delete-draft (Remove-StorePendingDraft) sends GET requests and one
#   DELETE of exactly the given draft, then reads it back as gone (HTTP 404)
#   and the app with no pending submission.
# - checks sign-in and the pending check fail closed on a dead port (127.0.0.1:9).
# The stand-in only models what the module relies on; the real service's JSON
# shapes, status changes and upload are not verified here.
# The `pester` job runs .github/scripts/tests (the same flow with a mocked HTTP
# layer, the draft check, the field comparison, the read-back, unconfirmed
# create and commit, URL rules, redirects, fixed error text, pricing,
# delete-by-id, and the msix run lookup steps of both Store workflows against
# stand-in GitHub API answers).

on:
  pull_request:
    paths:
      - .github/workflows/msstore-publish.yml
      - .github/workflows/msstore-publish-check.yml
      - .github/scripts/MsStoreRunner.psm1
      - .github/scripts/tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/msstore-publish.yml
      - .github/workflows/msstore-publish-check.yml
      - .github/scripts/MsStoreRunner.psm1
      - .github/scripts/tests/**
  workflow_dispatch:
    inputs:
      msix_run_id:
        description: 'Run id of a successful "msix" push run (default: newest on main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  STORE_PRODUCT_ID: 9NM3VWQ9MD7N
  EXPECTED_IDENTITY_NAME: jerisHQ.JerisLink
  EXPECTED_PUBLISHER: CN=89A018EB-5C52-49CB-B478-B462FA6B08DD

jobs:
  pester:
    # Unit tests: .github/scripts/tests. They also run the msix run lookup
    # steps of the two Store workflows, so .github/workflows is checked out.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows

      - name: Run Pester
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
            $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' } | Select-Object -First 1
          }
          Import-Module $pester.Path -Force
          Write-Host "PowerShell $($PSVersionTable.PSVersion), Pester $($pester.Version)"
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.github/scripts/tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.Result -ne 'Passed' -or $r.PassedCount -lt 1) { throw "Pester: $($r.Result), $($r.FailedCount) failed, $($r.PassedCount) passed" }

  dry-run:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Check the publish job in msstore-publish.yml
        run: |
          $wf = Get-Content .github/workflows/msstore-publish.yml -Raw
          # Every gh api call keeps gh's error output (the API's message) out of
          # the log (Pepper, PR #74 r8).
          foreach ($f in '.github/workflows/msstore-publish.yml', '.github/workflows/msstore-publish-check.yml') {
            $calls = @(Get-Content $f | Where-Object { $_ -match '\bgh\s+api\s+[$"]' })
            if ($calls.Count -eq 0 -or @($calls | Where-Object { $_ -notmatch '\bgh\s+api\s+\$Path\b[^}]*\s2>\$null' }).Count -gt 0) {
              throw "$f calls gh api without keeping its error output out of the log"
            }
          }
          $code = ($wf -split "`n" | Where-Object { $_.TrimStart() -notlike "#*" }) -join "`n"
          if ($code -match '(?m)^\s*msstore\s|microsoft-store-apppublisher|STORE_CLI_VERSION') { throw "msstore-publish.yml still uses the Store CLI" }
          if ($code -match '-ApiBase|-AuthorityHost|-LoopbackTestServer') { throw "msstore-publish.yml must use the default Store API and sign-in hosts" }
          $connect = 'Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET'
          $steps = @(
            $connect,
            'Publish-StoreSubmission -ProductId $env:STORE_PRODUCT_ID -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION -DeadlineUtc $deadline',
            $connect,
            'Assert-SubmissionHasPackage -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID -ExpectedVersion $env:EXPECTED_VERSION -ExpectedFileName $env:PKG_NAME'
          )
          $at = -1
          foreach ($st in $steps) {
            $i = $code.IndexOf($st, $at + 1)
            if ($i -lt 0) { throw "msstore-publish.yml does not run (in this order): $st" }
            $at = $i
          }
          if (([regex]::Matches($code, 'Publish-StoreSubmission ')).Count -ne 1) { throw "msstore-publish.yml must run Publish-StoreSubmission exactly once" }
          if ($code -notmatch 'SUBMISSION_ID: \$\{\{ steps\.submit\.outputs\.submission_id \}\}') { throw "the read-back does not use the submission id the publish step returned" }
          if (([regex]::Matches($code, 'PKG_NAME: \$\{\{ needs\.inspect\.outputs\.file_name \}\}')).Count -ne 2) { throw "the publish step and the read-back must both get the file name inspect showed (PKG_NAME)" }
          # Time budget: a step that times out prints nothing more. The publish
          # step sets its deadline before anything else, at least 2 min before
          # its timeout; every step of the publish job has a timeout, and they
          # add up to at most the job's, so the job cannot cut that step short.
          $submit = [regex]::Match($code, '(?ms)^      - name: Create the submission[^\n]*\n(?:(?!^      - ).)*').Value
          $stepMin = [regex]::Match($submit, '(?m)^        timeout-minutes: (\d+)\s*$')
          $dl = [regex]::Match($submit, '(?m)^          \$deadline = \[DateTime\]::UtcNow\.AddMinutes\((\d+)\)\s*$')
          if (-not $stepMin.Success -or -not $dl.Success) { throw 'the publish step must have timeout-minutes and set $deadline = [DateTime]::UtcNow.AddMinutes(N)' }
          if ([int]$dl.Groups[1].Value -gt [int]$stepMin.Groups[1].Value - 2) { throw "the publish step's deadline must be at least 2 min before its timeout" }
          if ($submit.IndexOf('$deadline = ') -gt $submit.IndexOf('Import-Module ')) { throw "the publish step must set its deadline before anything else" }
          $job = [regex]::Match($code, '(?ms)^  publish:\s*\n(?:(?!^  \S).)*').Value
          $jobMin = [regex]::Match($job, '(?m)^    timeout-minutes: (\d+)\s*$')
          $mins = @([regex]::Matches($job, '(?m)^        timeout-minutes: (\d+)\s*$') | ForEach-Object { [int]$_.Groups[1].Value })
          $count = [regex]::Matches($job, '(?m)^      - ').Count
          if (-not $jobMin.Success -or $count -lt 1 -or $mins.Count -ne $count) { throw "the publish job and each of its $count steps need timeout-minutes" }
          if (($mins | Measure-Object -Sum).Sum -gt [int]$jobMin.Groups[1].Value) { throw "the publish job's step timeouts add up to more than its timeout-minutes" }
          # The approver must see the package before approving: the job that
          # prints it must not be in the store environment or see its secrets.
          $inspect = [regex]::Match($wf, '(?ms)^  inspect:\s*\n(?:(?!^  \S).)*').Value
          if ($inspect -notmatch 'Package to publish after approval') { throw "inspect job does not print the package before approval" }
          if ($inspect -match '(?m)^\s+environment:' -or $inspect -match 'secrets\.') { throw "inspect job must not use an environment or secrets" }
          if ($wf -notmatch '(?ms)^  publish:\s*\n(?:(?!^  \S).)*?^\s+needs: inspect\s*$(?:(?!^  \S).)*?^\s+environment: store\s*$') { throw "publish job must need inspect and run in the store environment" }
          # mode=diagnose skips inspect, so publish (it needs inspect) too.
          if ($inspect -notmatch "(?m)^\s+&& inputs\.mode == 'publish'\)\s*$") { throw "inspect (and so publish) must run on a manual run only with mode=publish" }
          # The diagnose job: only on a manual run from main with
          # mode=diagnose, in the store environment, a checkout and one step
          # whose code is exactly: check the id, sign in, diagnose (GET calls
          # only; the module refuses anything else before it is sent).
          $diag = [regex]::Match($code, '(?ms)^  diagnose:\s*\n(?:(?!^  \S).)*').Value
          if (-not $diag) { throw "msstore-publish.yml has no diagnose job" }
          if ($diag -notmatch "(?m)^    if: github\.event_name == 'workflow_dispatch' && github\.ref == 'refs/heads/main' && inputs\.mode == 'diagnose'\s*$") { throw "the diagnose job must run only on a manual run from main with mode=diagnose" }
          if ($diag -notmatch '(?m)^    environment: store\s*$') { throw "the diagnose job must run in the store environment" }
          if ($diag -notmatch '(?m)^          SUBMISSION_ID: \$\{\{ inputs\.submission_id \}\}\s*$') { throw "the diagnose job must take the id from inputs.submission_id through env" }
          if ($diag -match '\$\{\{\s*inputs\.' -and ([regex]::Matches($diag, '\$\{\{\s*inputs\.')).Count -ne 1) { throw "the diagnose job may use an input only as SUBMISSION_ID" }
          $uses = @([regex]::Matches($diag, '(?m)^\s+(?:- )?uses: (\S+)\s*$') | ForEach-Object { $_.Groups[1].Value })
          if (($uses -join ',') -cne 'actions/checkout@v4' -or ([regex]::Matches($diag, '(?m)^      - ')).Count -ne 2) { throw "the diagnose job must be a checkout and one step" }
          $run = [regex]::Match($diag, '(?ms)^        run: \|\s*\n(.*)').Groups[1].Value
          $lines = @($run -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $want = @(
            "if (`$env:SUBMISSION_ID -cnotmatch '^[0-9]{1,20}\z') { throw 'submission_id must be a number' }",
            'Import-Module ./.github/scripts/MsStoreRunner.psm1',
            $connect,
            'Show-StoreSubmissionDiagnosis -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID'
          )
          if (($lines -join "`n") -cne ($want -join "`n")) { throw "the diagnose step must check the id, sign in and run Show-StoreSubmissionDiagnosis, and nothing else" }
          $jobMin = [regex]::Match($diag, '(?m)^    timeout-minutes: (\d+)\s*$')
          $mins = @([regex]::Matches($diag, '(?m)^        timeout-minutes: (\d+)\s*$') | ForEach-Object { [int]$_.Groups[1].Value })
          if (-not $jobMin.Success -or $mins.Count -ne 2 -or ($mins | Measure-Object -Sum).Sum -gt [int]$jobMin.Groups[1].Value) { throw "the diagnose job and its steps need timeouts that add up to at most the job's" }
          # The delete-draft job: only on a manual run from main with
          # mode=delete-draft, in the store environment, a checkout and one
          # step whose code is exactly: set the deadline, check the id, sign
          # in, delete that draft (GET calls and one DELETE of that id; the
          # module refuses anything else before it is sent).
          $del = [regex]::Match($code, '(?ms)^  delete-draft:\s*\n(?:(?!^  \S).)*').Value
          if (-not $del) { throw "msstore-publish.yml has no delete-draft job" }
          if ($del -notmatch "(?m)^    if: github\.event_name == 'workflow_dispatch' && github\.ref == 'refs/heads/main' && inputs\.mode == 'delete-draft'\s*$") { throw "the delete-draft job must run only on a manual run from main with mode=delete-draft" }
          if ($del -notmatch '(?m)^    environment: store\s*$') { throw "the delete-draft job must run in the store environment" }
          if ($del -notmatch '(?m)^          SUBMISSION_ID: \$\{\{ inputs\.submission_id \}\}\s*$') { throw "the delete-draft job must take the id from inputs.submission_id through env" }
          if (([regex]::Matches($del, '\$\{\{\s*inputs\.')).Count -ne 1) { throw "the delete-draft job may use an input only as SUBMISSION_ID" }
          $uses = @([regex]::Matches($del, '(?m)^\s+(?:- )?uses: (\S+)\s*$') | ForEach-Object { $_.Groups[1].Value })
          if (($uses -join ',') -cne 'actions/checkout@v4' -or ([regex]::Matches($del, '(?m)^      - ')).Count -ne 2) { throw "the delete-draft job must be a checkout and one step" }
          $run = [regex]::Match($del, '(?ms)^        run: \|\s*\n(.*)').Groups[1].Value
          $lines = @($run -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $dl = [regex]::Match($lines[0], '^\$deadline = \[DateTime\]::UtcNow\.AddMinutes\((\d+)\)$')
          $want = @(
            $lines[0],
            "if (`$env:SUBMISSION_ID -cnotmatch '^[0-9]{1,20}\z') { throw 'submission_id must be a number' }",
            'Import-Module ./.github/scripts/MsStoreRunner.psm1',
            $connect,
            'Remove-StorePendingDraft -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID -DeadlineUtc $deadline'
          )
          if (-not $dl.Success -or ($lines -join "`n") -cne ($want -join "`n")) { throw "the delete-draft step must set its deadline, check the id, sign in and run Remove-StorePendingDraft, and nothing else" }
          $stepMin = [regex]::Match($del, '(?m)^        timeout-minutes: (\d+)\s*$(?![\s\S]*^        timeout-minutes:)')
          if ([int]$dl.Groups[1].Value -gt [int]$stepMin.Groups[1].Value - 1) { throw "the delete-draft step's deadline must be at least 1 min before its timeout" }
          $jobMin = [regex]::Match($del, '(?m)^    timeout-minutes: (\d+)\s*$')
          $mins = @([regex]::Matches($del, '(?m)^        timeout-minutes: (\d+)\s*$') | ForEach-Object { [int]$_.Groups[1].Value })
          if (-not $jobMin.Success -or $mins.Count -ne 2 -or ($mins | Measure-Object -Sum).Sum -gt [int]$jobMin.Groups[1].Value) { throw "the delete-draft job and its steps need timeouts that add up to at most the job's" }
          if (([regex]::Matches($code, 'Remove-StorePendingDraft |Remove-StoreDraftSubmission ')).Count -ne 1) { throw "msstore-publish.yml may delete only in the delete-draft job, once" }
          Write-Host "msstore-publish.yml: publish job order, package gate and time budget OK; diagnose job gated, in the store environment, GET-only call OK; delete-draft job gated, in the store environment, one call with its deadline OK"

      - name: Find the msix run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.msix_run_id }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          # Only fixed text and values of a fixed shape from the GitHub API
          # reach the log or the outputs (Pepper, PR #74 r8 and r9). gh's error
          # output (the API's message) is kept out of the log. An answer that
          # is not exactly one complete JSON object (Test-JsonObject: a key
          # given twice at any depth, also in another case, text before or after
          # it, a comment, a bad literal, an array) or a field that is missing,
          # not text or of another shape stops the job with fixed text: a
          # parser's or a cast's own message can quote the answer, so every error
          # but this step's own (Stop-Lookup) is replaced by fixed text. The
          # branch of the run is never printed, only whether it is main.
          # Each path below holds only values checked before it is built.
          function Stop-Lookup([string]$Text) { $e = [System.InvalidOperationException]::new($Text); $e.Data['Lookup'] = $true; throw $e }
          # True when Text is exactly one complete JSON object as System.Text.Json
          # reads it by default (nothing before or after it, no comments, trailing
          # commas or single quotes, all of which ConvertFrom-Json takes) in which
          # no object, at any depth, has a key twice, also not in another case
          # (ConvertFrom-Json keeps the last of two equal keys; a lookup here does
          # not tell them apart). Pepper, PR #74 r10. Never throws.
          function Test-JsonObject([string]$Text) {
            $doc = $null
            try {
              $doc = [System.Text.Json.JsonDocument]::Parse($Text)
              if ($doc.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) { return $false }
              $todo = [System.Collections.Generic.Stack[System.Text.Json.JsonElement]]::new()
              $todo.Push($doc.RootElement)
              while ($todo.Count -gt 0) {
                $e = $todo.Pop()
                if ($e.ValueKind -eq [System.Text.Json.JsonValueKind]::Object) {
                  $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                  foreach ($p in $e.EnumerateObject()) { if (-not $seen.Add($p.Name)) { return $false }; $todo.Push($p.Value) }
                } elseif ($e.ValueKind -eq [System.Text.Json.JsonValueKind]::Array) {
                  foreach ($i in $e.EnumerateArray()) { $todo.Push($i) }
                }
              }
              $true
            } catch { $false } finally { if ($null -ne $doc) { $doc.Dispose() } }
          }
          function Invoke-GitHubApi([string]$Path) {
            $out = gh api $Path 2>$null
            if ($LASTEXITCODE -ne 0) { Stop-Lookup "GitHub API GET $Path failed (gh exit code $LASTEXITCODE; its answer is not printed)" }
            $o = $null
            $text = $out -join "`n"
            if (Test-JsonObject $text) { try { $o = ConvertFrom-Json -InputObject $text -NoEnumerate -ErrorAction Stop } catch { } }
            if ($o -isnot [System.Management.Automation.PSCustomObject]) { Stop-Lookup "the GitHub API answer to GET $Path is not one JSON object that parses (not printed)" }
            $o
          }
          # A field by its exact name: its value, or $null when it is missing.
          function Get-Field($Object, [string]$Name) {
            if ($Object -isnot [System.Management.Automation.PSCustomObject]) { return $null }
            $p = $Object.PSObject.Properties[$Name]
            if ($p -and $p.Name -ceq $Name) { , $p.Value }
          }
          # A field as text: '' when it is missing, null or not a JSON string.
          function Get-Text($Object, [string]$Name) {
            $v = Get-Field $Object $Name
            if ($v -is [string]) { $v } else { '' }
          }
          # The run id (GitHub sends a JSON number), as digits, or ''.
          function Get-RunId($Run) {
            $v = Get-Field $Run 'id'
            if (($v -is [long] -or $v -is [int]) -and $v -gt 0) { [string]$v } else { '' }
          }
          try {
            if ($env:RUN_ID) {
              if ($env:RUN_ID -cnotmatch '^[0-9]{1,20}\z') { Stop-Lookup 'msix_run_id must be a number' }
              $run = Invoke-GitHubApi "repos/$repo/actions/runs/$env:RUN_ID"
              if ((Get-RunId $run) -cne $env:RUN_ID) { Stop-Lookup "the GitHub API did not answer with run $env:RUN_ID" }
            } else {
              $list = Get-Field (Invoke-GitHubApi "repos/$repo/actions/workflows/msix.yml/runs?branch=main&event=push&status=success&per_page=1") 'workflow_runs'
              if ($list -isnot [array]) { Stop-Lookup 'the GitHub API answer has no list of workflow runs (not printed)' }
              if ($list.Count -eq 0) { Stop-Lookup 'no successful msix push run on main' }
              $run = $list[0]
              if ((Get-Text $run 'head_branch') -cne 'main') { Stop-Lookup 'the newest run the GitHub API answered is not on main' }
            }
            if ((Get-Text $run 'name') -cne 'msix' -or (Get-Text $run 'event') -cne 'push' -or (Get-Text $run 'conclusion') -cne 'success' -or
                (Get-Text (Get-Field $run 'head_repository') 'full_name') -ne $repo) { Stop-Lookup 'not a successful msix push run of this repository' }
            $runId = Get-RunId $run
            $sha = Get-Text $run 'head_sha'
            if ($runId -cnotmatch '^[0-9]{1,20}\z' -or $sha -cnotmatch '^[0-9a-f]{40}\z') {
              Stop-Lookup 'the GitHub API answered a run id or commit sha of an unexpected shape (not printed)'
            }
            $file = Invoke-GitHubApi "repos/$repo/contents/VERSION?ref=$sha"
            if ((Get-Text $file 'encoding') -cne 'base64') { Stop-Lookup "the GitHub API answered VERSION at $sha without base64 content (not printed)" }
            $version = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Text $file 'content'))).Split("`n")[0].Trim() + '.0'
            if ($version -cnotmatch '^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}\.0\z') { Stop-Lookup "VERSION at $sha is not MAJOR.MINOR.PATCH (its text is not printed)" }
            $ref = if ((Get-Text $run 'head_branch') -ceq 'main') { 'main' } else { '[not shown]' }
            Write-Host "msix run ${runId}: event=push ref=$ref sha=$sha -> expected package version $version"
            "run_id=$runId" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          } catch {
            if ($_.Exception.Data['Lookup']) { throw }
            throw 'the msix run lookup failed; its error message is not printed (it can quote the GitHub API answer)'
          }

      - name: Download the Store package artifact
        uses: actions/download-artifact@v4
        with:
          name: jerislink-msix-store
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store

      - name: Check the package identity and version
        id: pkg
        env:
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
        run: |
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'store') | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          $p = Get-StorePackage -Dir (Join-Path $env:RUNNER_TEMP 'store') -ExpectedName $env:EXPECTED_IDENTITY_NAME `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER -ExpectedVersion $env:EXPECTED_VERSION
          if ($p.Version -ne $env:EXPECTED_VERSION) { throw "Get-StorePackage returned Version $($p.Version)" }
          if ($p.FileName -ne (Split-Path -Leaf $p.Path) -or $p.Sha256 -notmatch '^[0-9a-f]{64}$') { throw "Get-StorePackage returned unexpected FileName/Sha256" }
          Write-Host "PKG_FILE=$($p.Path) Version=$($p.Version) SHA256=$($p.Sha256)"
          "file=$($p.Path)" >> $env:GITHUB_OUTPUT
          "file_name=$($p.FileName)" >> $env:GITHUB_OUTPUT
          "sha256=$($p.Sha256)" >> $env:GITHUB_OUTPUT

      - name: Dry run of the publish flow against a local stand-in for the Store API
        timeout-minutes: 8
        env:
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ steps.pkg.outputs.file_name }}
          PKG_SHA256: ${{ steps.pkg.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
        run: |
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Import-Module ./.github/scripts/tests/FakeStoreApi.psm1
          $secret = 'dry-run-secret-' + [guid]::NewGuid().ToString('N')
          # Runs a command with verbose and debug output on, shows what it
          # printed (Write-Host), returns value, text of every stream and error.
          # Verbose and debug records are counted, not shown: none may describe
          # a request (PowerShell 7.6 writes URL, headers and body there).
          function Invoke-Shown([scriptblock]$b) {
            $printed = [Collections.Generic.List[string]]::new(); $value = @(); $err = ''; $noisy = 0
            $saved = $global:VerbosePreference, $global:DebugPreference
            try {
              $global:VerbosePreference = 'Continue'; $global:DebugPreference = 'Continue'
              $value = @(& $b *>&1 | ForEach-Object {
                if ($_ -is [Management.Automation.InformationRecord]) { $printed.Add([string]$_.MessageData); Write-Host "  | $($_.MessageData)" }
                elseif ($_ -is [Management.Automation.VerboseRecord] -or $_ -is [Management.Automation.DebugRecord] -or $_ -is [Management.Automation.WarningRecord]) {
                  $printed.Add("$_"); if ("$_" -match 'HTTP/|payload|https?://|Bearer|client_secret|sig=') { $noisy++ } }
                else { $_ } })
            } catch { $err = "$_"; Write-Host "  ! $err" }
            finally { $global:VerbosePreference, $global:DebugPreference = $saved }
            if ($noisy) { throw "$noisy verbose or debug record(s) describe a request" }
            [pscustomobject]@{ Value = $value; Text = (($printed -join "`n") + "`n" + $err); Err = $err }
          }
          function Assert-NoLeak([string]$text, $store) {
            foreach ($bad in @($secret, $store.Token, 'FAKE+SAS', 'FAKE%2BSAS', 'SIGNATURE-0123456789', '/blob/')) {
              if ($text.Contains($bad)) { throw "output contains a secret, token or SAS URL part" }
            }
            # No price either: the stand-in's priceId, trialPeriod, market and sale prices.
            if ($text -cmatch '\bFree\b|Tier[0-9]|NoFreeTrial|Launch sale') { throw "output contains a price" }
          }
          $app = $env:STORE_PRODUCT_ID
          $base = "/v1.0/my/applications/$app"

          # 1. The whole flow with the real package, over HTTP.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION
          $url = Start-FakeStoreServer -Store $s
          try {
            $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer }
            if ($r.Err) { throw "sign-in to the stand-in failed" }
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err) { throw "publish flow failed against the stand-in" }
            Assert-NoLeak $r.Text $s
            if ($r.Text -notmatch 'fields unchanged: \d+ submission fields') { throw "the fields were not compared before commit" }
            if ($r.Text -cnotmatch 'price check: pricing\.priceId is set and is kept as is \(the price is not printed\)') { throw "the price check line is not the fixed text" }
            $id = $s.NewId
            if (@($r.Value) -join ',' -ne $id) { throw "Publish-StoreSubmission returned '$(@($r.Value) -join ',')', not $id" }
            if ($s.CreateQuery -cne '?isMinimalResponse=true') { throw "the create was not sent with ?isMinimalResponse=true" }
            $want = @("POST /tenant-dry-run/oauth2/v2.0/token", "GET $base", "POST $base/submissions", "GET $base", "GET $base/submissions/$id",
                      "PUT $base/submissions/$id", "PUT /blob/upload.zip", "GET $base/submissions/$id", "POST $base/submissions/$id/commit")
            $got = @($s.Log)
            Write-Host "calls:`n  $($got -join "`n  ")"
            if (($got -join "`n") -cne ($want -join "`n")) { throw "the calls differ from the expected flow" }
            if ($s.BlobHeaders['x-ms-blob-type'] -cne 'BlockBlob' -or $s.BlobHeaders['Content-Type'] -cne 'application/zip') { throw "upload headers are wrong" }
            $z = @(Get-FakeUploadedZip $s)
            if ($z.Count -ne 1 -or $z[0].Name -cne $env:PKG_NAME) { throw "the uploaded zip must hold only $env:PKG_NAME at its root" }
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([byte[]]$z[0].Bytes)).ToLower()
            if ($sha -ne $env:PKG_SHA256) { throw "the uploaded package differs from the checked one" }
            Write-Host "uploaded zip: $($z[0].Name) SHA256=$sha (same as the checked package)"
            $r = Invoke-Shown { Assert-SubmissionHasPackage -ProductId $app -SubmissionId $id -ExpectedVersion $env:EXPECTED_VERSION -ExpectedFileName $env:PKG_NAME -TimeoutMinutes 0 -IntervalSeconds 0 }
            if ($r.Err) { throw "read-back failed against the stand-in" }
            if ($r.Text -notmatch "(?m)^  package fileName=$([regex]::Escape($env:PKG_NAME)) version=$([regex]::Escape($env:EXPECTED_VERSION)) fileStatus=Uploaded$") { throw "the read-back did not show the package file name inspect showed" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 2. An uncommitted draft (PendingCommit) the run did not create: stop
          # before create, name the draft, a person decides; it is only read.
          $s = New-FakeStore -AppId $app -PendingId '1152921505000000007'
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err -notmatch "already has a pending submission 1152921505000000007 for $app\: an uncommitted draft \(status PendingCommit\)" -or
                $r.Err -notmatch "it does not delete, change or commit draft 1152921505000000007\. A person decides what happens to draft 1152921505000000007\. " -or
                $r.Err -notmatch "mode=diagnose and submission_id=1152921505000000007 " -or
                $r.Err -notmatch "If the person decides to discard it: .*DELETE $([regex]::Escape($base))/submissions/1152921505000000007 ") { throw "a pending draft did not stop the run with its id and 'a person decides'" }
            if ((@($s.Log) -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base`nGET $base/submissions/1152921505000000007") { throw "calls after the pending check: $(@($s.Log) -join ', ')" }
            if ($s.PendingId -cne '1152921505000000007') { throw "the pending draft changed" }
            Assert-NoLeak $r.Text $s
            Write-Host "pending PendingCommit draft: stopped before create, read only, a person decides"
          } finally { Stop-FakeStoreServer -Store $s }

          # 3. Dead port: sign-in and the pending check fail closed, with fixed text.
          $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost 'http://127.0.0.1:9' -ApiBase 'http://127.0.0.1:9' -LoopbackTestServer }
          if ($r.Err -notmatch '^could not get a Partner Center access token: no response \(' -or $r.Text.Contains($secret)) { throw "sign-in on a dead port did not fail closed with fixed text" }
          $s = New-FakeStore -AppId $app
          $url = Start-FakeStoreServer -Store $s
          try { Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase 'http://127.0.0.1:9' -LoopbackTestServer } | Out-Null }
          finally { Stop-FakeStoreServer -Store $s }
          $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
          if ($r.Err -notmatch "Store API GET /v1\.0/my/applications/$app failed: no response \(.*cannot check for a pending submission; not publishing") { throw "pending check on a dead port did not fail closed" }
          Assert-NoLeak $r.Text $s

          # 4. The PUT changes the pricing: stop uncommitted, delete-by-id guidance, no commit.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -DriftOnPut Pricing
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err -notmatch "submission fields changed after this run's update: pricing\." -or $r.Err -notmatch "DELETE $([regex]::Escape($base))/submissions/$($s.NewId) ") { throw "a pricing change did not stop the run uncommitted with delete-by-id guidance" }
            if (@($s.Log) -contains "POST $base/submissions/$($s.NewId)/commit") { throw "committed after a pricing change" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 5. Without -LoopbackTestServer nothing goes to the stand-in.
          $s = New-FakeStore -AppId $app
          $url = Start-FakeStoreServer -Store $s
          try {
            $r = Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url }
            if ($r.Err -notmatch '^refused: ' -or @($s.Log).Count -ne 0) { throw "a loopback stand-in was used without -LoopbackTestServer" }
          } finally { Stop-FakeStoreServer -Store $s }
          # 6. The commit gets a 504 while the Store is still processing it: read
          #    that id back (asynchronous commit) until it shows CommitStarted, then
          #    go on. No DELETE call, no delete text.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -LoseResponse Commit -LoseWhen Delayed -LoseAsStatus 504 -CommitDelayReads 1
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION -CommitReadBackAttempts 3 -CommitReadBackIntervalSeconds 0 }
            if ($r.Err) { throw "a commit that got a 504 and later showed CommitStarted stopped the run" }
            $id = $s.NewId
            if (@($r.Value) -join ',' -ne $id) { throw "Publish-StoreSubmission returned '$(@($r.Value) -join ',')', not $id" }
            if ($r.Text -notmatch "read-back 2 by id shows status CommitStarted: it was committed") { throw "the commit was not confirmed by reading the id back" }
            if ($r.Text -match 'DELETE /v1|Remove-StoreDraftSubmission|Delete exactly') { throw "delete advice for a commit that may still be processing" }
            $tail = @($s.Log)[-3..-1]
            if (($tail -join "`n") -cne (@("POST $base/submissions/$id/commit", "GET $base/submissions/$id", "GET $base/submissions/$id") -join "`n")) { throw "calls after the commit: $($tail -join ', ')" }
            if (@($s.Log) -match '^DELETE ') { throw "a DELETE was sent" }
            $r = Invoke-Shown { Assert-SubmissionHasPackage -ProductId $app -SubmissionId $id -ExpectedVersion $env:EXPECTED_VERSION -ExpectedFileName $env:PKG_NAME -TimeoutMinutes 0 -IntervalSeconds 0 }
            if ($r.Err) { throw "read-back after the delayed commit failed" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }

          # 7. Someone else creates a draft after the pending check and the create
          #    gets a 504: report the pending id as of unconfirmed origin, no delete
          #    advice, nothing after the read-back.
          $other = '1152921505000000077'
          $s = New-FakeStore -AppId $app -OtherDraftAfterCheck $other -LoseResponse Create -LoseWhen After -LoseAsStatus 504
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            if ($r.Err -notmatch "a pending submission $other exists, origin unconfirmed") { throw "a pending submission after a create with no answer was not reported as of unconfirmed origin" }
            if ($r.Err -match 'DELETE /v1|Remove-StoreDraftSubmission|Delete exactly|this run''s draft') { throw "delete advice or an origin claim for a submission this run cannot tell is its own" }
            if ((@($s.Log) -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base`nPOST $base/submissions`nGET $base") { throw "calls after the read-back: $(@($s.Log) -join ', ')" }
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }
          # 8. The commit never answers: the id and how to check it are printed
          #    before the commit is sent, "result unconfirmed" with the id right
          #    after its timeout and before the first read-back; then the run stops
          #    unconfirmed with no delete or retry advice.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -HangOn Commit
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION -CommitTimeoutSeconds 3 -CommitReadBackAttempts 2 -CommitReadBackIntervalSeconds 1 -CommitReadBackTimeoutSeconds 5 -CommitReadBackBudgetSeconds 20 }
            $sw.Stop()
            $id = $s.NewId
            $pre = $r.Text.IndexOf("committing submission $id (waiting up to 3 s for the answer). If this step ends before a commit result is printed below, the result is unconfirmed: check GET $base/submissions/$id by hand")
            $warn = $r.Text.IndexOf("::warning title=Store commit::Result unconfirmed: the commit request for submission $id got no answer (Store API POST $base/submissions/$id/commit failed: no response (")
            $next = $r.Text.IndexOf("commit of submission $id not confirmed yet (read-back 1 of 2 shows status PendingCommit)")
            if ($pre -lt 0 -or $warn -le $pre -or $next -le $warn) { throw "the id and the hand-check text were not printed before the commit and before the read-backs ($pre, $warn, $next)" }
            if ($r.Err -notmatch "Read back by id 2 time\(s\), 1 s apart; last: read-back 2 of 2 shows status PendingCommit\..*A person needs to check GET $([regex]::Escape($base))/submissions/$id later") { throw "a commit that never answered did not stop unconfirmed" }
            if ($r.Text -match 'DELETE /v1|Remove-StoreDraftSubmission|Delete exactly|(?<!do not )re-run this workflow|\bretry\b|commit (it )?again') { throw "delete or retry advice while the commit result is unconfirmed" }
            $tail = @($s.Log)[-3..-1]
            if (($tail -join "`n") -cne (@("POST $base/submissions/$id/commit", "GET $base/submissions/$id", "GET $base/submissions/$id") -join "`n")) { throw "calls after the commit: $($tail -join ', ')" }
            if ($sw.Elapsed.TotalSeconds -gt 30) { throw "the commit timeout and read-backs took $([int]$sw.Elapsed.TotalSeconds) s" }
            Write-Host "commit with no answer: unconfirmed after $([int]$sw.Elapsed.TotalSeconds) s"
            Assert-NoLeak $r.Text $s
          } finally { Stop-FakeStoreServer -Store $s }
          # 9. The create is refused with HTTP 400 and a message that carries a SAS
          #    URL, sig=, a bearer token, the access token, the client secret, delete
          #    advice and both workflow command syntaxes (double colon, and the legacy
          #    double hash with a bracket) mid-line and after a line break. The error
          #    line shows the code, the target only when it is a listed submission
          #    field name (else "[unlisted target]") and the module's own hint;
          #    nothing of the message.
          #    One read-only GET of the app follows; nothing is deleted.
          $cc = ':' * 2; $hh = '#' * 2
          foreach ($case in @(
              @{ Target = 'applicationCategory'; Shown = 'applicationCategory' },
              @{ Target = "applicationCategory $($hh)[warning]injected $($cc)error$($cc)injected"; Shown = '[unlisted target]' })) {
            $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -CreateErrorStatus 400
            $url = Start-FakeStoreServer -Store $s
            try {
              Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
              $planted = "Package rejected.`n$($cc)error$($cc)injected see $($hh)[error]injected https://jlfakeupload.blob.core.windows.net/blob/upload.zip?sv=2020-08-04&sig=FAKE+SAS%2FSIGNATURE-0123456789 " +
                "sig=FAKE+SAS%2FSIGNATURE-0123456789 Bearer $($s.Token) token $($s.Token) client_secret=`"$secret`" eyJhbGciOi.eyJzdWIiOi.c2lnbmF0dXJl " +
                "Delete submission 1152921505000000007 and create it again.`n$($hh)[set-output name=x;]injected"
              $s.CreateErrorBody = @{ code = 'InvalidParameterValue'; target = $case.Target; message = $planted } | ConvertTo-Json -Compress
              $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
              $line = "Store API POST $base/submissions?isMinimalResponse=true failed: HTTP 400 (InvalidParameterValue); target: $($case.Shown); " +
                'hint: a parameter in the request body is invalid. No submission was created and none was deleted.'
              if (-not $r.Err.StartsWith($line)) { throw "a refused create did not print the code, the target as '$($case.Shown)' and the hint" }
              if (-not $r.Err.EndsWith('Read-back of the app after the refused create (one GET; nothing changed or deleted): no pendingApplicationSubmission.')) { throw "no read-back of the app after the refused create" }
              if ($r.Text.Contains($cc + 'error') -or $r.Text.Contains($hh + '[') -or $r.Text -match 'injected|rejected|eyJ|sv=2020|client_secret|Bearer|DELETE /v1|Remove-StoreDraftSubmission|Delete exactly|Delete submission') {
                throw "a workflow command, part of the API message or delete advice was printed"
              }
              if ($s.CreateQuery -cne '?isMinimalResponse=true') { throw "the create was not sent with ?isMinimalResponse=true" }
              if ((@($s.Log) -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base`nPOST $base/submissions`nGET $base") { throw "calls after the refused create: $(@($s.Log) -join ', ')" }
              Assert-NoLeak $r.Text $s
              Write-Host "refused create: target shown as $($case.Shown), no message text"
            } finally { Stop-FakeStoreServer -Store $s }
          }
          # 10. The read of the new submission before its update is answered HTTP
          #     202 (accepted, not a usable read) with a token, the client secret
          #     and a SAS URL in its body: stop uncommitted with "Could not
          #     verify" and look-by-id only, no delete or re-run advice, nothing
          #     of that body printed, nothing sent after that GET.
          $s = New-FakeStore -AppId $app -Version $env:EXPECTED_VERSION -FailReadOn SubmissionRead -FailReadStatus 202
          $s.FailReadBody = @{ id = 'planted'; status = "Bearer $($s.Token)"; code = "client_secret=$secret"
            applicationPackages = @(@{ fileName = 'https://jlfakeupload.blob.core.windows.net/blob/upload.zip?sv=2020-08-04&sig=FAKE+SAS%2FSIGNATURE-0123456789' }) } | ConvertTo-Json -Depth 5 -Compress
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Publish-StoreSubmission -ProductId $app -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION }
            $id = $s.NewId
            if (-not $s.ReadFailed -or $r.Err -notmatch "^Store API GET $([regex]::Escape($base))/submissions/$id failed: HTTP 202 .*Could not verify: .*A person needs to check submission $id \(look only, change nothing in Partner Center\) with GET $([regex]::Escape($base))/submissions/$id\.") { throw "a read answered HTTP 202 did not stop with 'Could not verify' and look-by-id guidance" }
            if ($r.Text -match 'DELETE /v1|DELETE |Remove-StoreDraftSubmission|Delete exactly|re-run|rerun|\bretry\b|planted|eyJ|sv=2020|client_secret|Bearer') { throw "delete or re-run advice, or part of the read's body, was printed" }
            if ((@($s.Log) -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base`nPOST $base/submissions`nGET $base`nGET $base/submissions/$id") { throw "calls after the failed read: $(@($s.Log) -join ', ')" }
            Assert-NoLeak $r.Text $s
            Write-Host "read answered HTTP 202: could not verify, no delete or re-run advice"
          } finally { Stop-FakeStoreServer -Store $s }

          # 11. mode=diagnose on the pending draft whose market price changed:
          # after the sign-in only GET requests reach the stand-in, nothing
          # changes, and the differing paths are printed, never the values.
          $s = New-FakeStore -AppId $app -PendingId '1152921505000000007' -DriftOnPut MarketPrice
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $fields = $s.PendingFields
            $r = Invoke-Shown { Show-StoreSubmissionDiagnosis -ProductId $app -SubmissionId '1152921505000000007' }
            if ($r.Err) { throw "diagnose failed against the stand-in" }
            $got = @($s.Log)
            Write-Host "calls:`n  $($got -join "`n  ")"
            if (($got -join "`n") -cne "POST /tenant-dry-run/oauth2/v2.0/token`nGET $base`nGET $base/submissions/1152921505000000007`nGET $base/submissions/1152921505000000001") { throw "diagnose sent more than the sign-in and three GET requests" }
            if (@($s.Seen | Where-Object { $_.Line -cnotmatch '^(GET /v1\.0/|POST /tenant-dry-run/oauth2/v2\.0/token$)' }).Count) { throw "a request other than a GET reached the stand-in" }
            if ($s.PendingId -cne '1152921505000000007' -or $s.PendingFields -cne $fields -or $s.Sub -or $s.Blob) { throw "diagnose changed the stand-in" }
            if ($r.Text -notmatch '(?m)^pricing sub-fields that differ: pricing\.marketSpecificPricings\.HK, ' -or $r.Text -notmatch '(?m)would stop on pricing\.marketSpecificPricings\.HK$') { throw "diagnose did not name the changed market price" }
            if ($r.Text -cmatch 'Tier\d|Launch sale|Submission [12]|NoFreeTrial') { throw "diagnose printed a field value" }
            Assert-NoLeak $r.Text $s
            Write-Host "diagnose: GET requests only after the sign-in, paths only"
          } finally { Stop-FakeStoreServer -Store $s }

          # 12. mode=delete-draft on the pending PendingCommit draft: after the
          # sign-in, GET requests and one DELETE of exactly that id; then it
          # is gone (HTTP 404) and the app shows no pending submission.
          $s = New-FakeStore -AppId $app -PendingId '1152921505000000007'
          $url = Start-FakeStoreServer -Store $s
          try {
            Invoke-Shown { Connect-StoreApi -TenantId 'tenant-dry-run' -ClientId 'client-dry-run' -ClientSecret $secret -AuthorityHost $url -ApiBase $url -LoopbackTestServer } | Out-Null
            $r = Invoke-Shown { Remove-StorePendingDraft -ProductId $app -SubmissionId '1152921505000000007' -DeadlineUtc ([DateTime]::UtcNow.AddMinutes(4)) }
            if ($r.Err) { throw "delete-draft failed against the stand-in" }
            $got = @($s.Log)
            Write-Host "calls:`n  $($got -join "`n  ")"
            $want = @("POST /tenant-dry-run/oauth2/v2.0/token", "GET $base", "GET $base/submissions/1152921505000000007", "GET $base/submissions/1152921505000000007",
                      "DELETE $base/submissions/1152921505000000007", "GET $base/submissions/1152921505000000007", "GET $base")
            if (($got -join "`n") -cne ($want -join "`n")) { throw "delete-draft sent other requests than the sign-in, the GETs and one DELETE of that id" }
            if (@($s.Seen | Where-Object { $_.Line -cnotmatch '^(GET /v1\.0/|DELETE /v1\.0/my/applications/[^/]+/submissions/1152921505000000007$|POST /tenant-dry-run/oauth2/v2\.0/token$)' }).Count) { throw "a request other than a GET or that DELETE reached the stand-in" }
            if ($s.PendingId -or $s.Sub -or $s.Blob) { throw "delete-draft left a pending submission or created something" }
            if ($r.Text -notmatch '(?m)^submission 1152921505000000007 before: status PendingCommit$' -or $r.Text -notmatch '(?m)^submission 1152921505000000007 after: HTTP 404 \(gone\)$' -or
                $r.Text -notmatch '(?m)^app \S+ after: pending submission \[none\]$') { throw "delete-draft did not print the status before and that it is gone after" }
            if ($r.Text -cmatch 'Tier\d|Launch sale|Submission [12]|NoFreeTrial') { throw "delete-draft printed a field value" }
            Assert-NoLeak $r.Text $s
            Write-Host "delete-draft: GET requests and one DELETE of that id after the sign-in; gone afterwards"
          } finally { Stop-FakeStoreServer -Store $s }
          Write-Host "dry run: all assertions passed"
