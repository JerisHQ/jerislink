name: macos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build JerisLink.app (ad-hoc signed)
        working-directory: personal/mac-host
        env:
          JERISLINK_ALLOW_ADHOC: '1'
        run: ./Deploy/build-apps.sh "$RUNNER_TEMP/build"
      - name: Verify bundle layout, signature and both executables
        working-directory: personal/mac-host
        run: ./Deploy/verify-bundle.sh "$RUNNER_TEMP/build/JerisLink.app"
      - name: Host self-test (control peer, settings policy)
        run: '"$RUNNER_TEMP/build/JerisLink.app/Contents/MacOS/JerisLinkHost" --self-test'
