name: macos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build JerisLink.app (ad-hoc signed)
        working-directory: personal/mac-host
        env:
          JERISLINK_ALLOW_ADHOC: '1'
        run: ./Deploy/build-apps.sh "$RUNNER_TEMP/build"
      - name: Verify bundle layout, signature and both executables
        working-directory: personal/mac-host
        run: ./Deploy/verify-bundle.sh "$RUNNER_TEMP/build/JerisLink.app"
      - name: Host self-test (control peer, settings policy, connection password)
        env:
          JERISLINK_AUTH_VECTORS: personal/protocol/auth_vectors.json
          JERISLINK_SELFTEST_KEYCHAIN: '1'
        run: '"$RUNNER_TEMP/build/JerisLink.app/Contents/MacOS/JerisLinkHost" --self-test'
      - name: Input helper self-test (status throttle, display bounds cache)
        run: '"$RUNNER_TEMP/build/JerisLink.app/Contents/Helpers/JerisLink Input Helper.app/Contents/MacOS/JerisLinkInputHelper" --self-test'
      - name: Send helper self-test (Finder Service checks, alerts)
        run: '"$RUNNER_TEMP/build/JerisLink.app/Contents/Library/Helpers/JerisLink Send.app/Contents/MacOS/JerisLinkSend" --self-test'
