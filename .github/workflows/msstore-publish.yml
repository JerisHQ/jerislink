name: msstore-publish

# Uploads the .msixupload that the `msix` workflow built for a released commit
# to Partner Center as a DRAFT submission for Store product 9NM3VWQ9MD7N.
#
# Triggers
# - release `released`: a GitHub release is published as a full release (or a
#   prerelease is promoted to one). Draft releases and prereleases do not fire
#   it. release.yml creates the release as a draft on a v* tag push; publishing
#   that draft by hand is the release decision, and that is what starts this.
# - workflow_dispatch (fallback): give the run id of a successful `msix` run.
#
# Package selection: the job never builds. It finds the successful `msix` push
# run for exactly the released commit and downloads its jerislink-msix-store
# artifact (the bytes CI already checked, WACK-tested and sideload-installed).
# No matching run means the job fails; it never falls back to another commit.
# The commit must also be in main's history.
#
# - Runs in the `store` environment, so its secrets are only released after the
#   environment's reviewers approve. The environment's deployment policy must
#   allow the tag ref (refs/tags/v*) for the release trigger to get past it.
# - Before uploading, the job asks Partner Center whether the app already has a
#   pending submission and stops if it does. `msstore publish` would otherwise
#   delete that draft (when a published submission exists) to make room for the
#   new one. There is no override: resolve the draft in Partner Center and re-run.
# - `msstore publish --noCommit` keeps the submission in draft state: nothing
#   goes to certification or the Store until someone presses "Submit" in
#   Partner Center by hand.
# - Secrets reach msstore only through step env vars in the sign-in step; they
#   are never echoed, written to disk by this workflow, or put in the repo.
# - The Store CLI version is pinned (STORE_CLI_VERSION). The publish command
#   line and the credential cleanup are written for that version; see
#   .github/scripts/MsStoreRunner.psm1. msstore-publish-check.yml runs the same
#   steps without secrets on every change to these files.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      msix_run_id:
        description: 'Run id of a successful "msix" push run whose commit is in main (its jerislink-msix-store artifact is uploaded)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: msstore-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9NM3VWQ9MD7N
  EXPECTED_IDENTITY_NAME: jerisHQ.JerisLink
  EXPECTED_PUBLISHER: CN=89A018EB-5C52-49CB-B478-B462FA6B08DD
  STORE_CLI_VERSION: v0.4.4

jobs:
  publish-draft:
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        && !github.event.release.draft && !github.event.release.prerelease)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    environment: store
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Find the msix run for this commit and check the commit is in main
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_ID: ${{ inputs.msix_run_id }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          if ($env:EVENT -eq 'release') {
            if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "release tag '$env:TAG' is not vMAJOR.MINOR.PATCH" }
            $sha = (gh api "repos/$repo/commits/$env:TAG" | ConvertFrom-Json).sha
            if ($sha -ne $env:GITHUB_SHA) { throw "tag $env:TAG points at $sha, but the event is for $env:GITHUB_SHA" }
            $runs = (gh api "repos/$repo/actions/workflows/msix.yml/runs?head_sha=$sha&event=push&status=success&per_page=20" | ConvertFrom-Json).workflow_runs |
              Where-Object { $_.head_sha -eq $sha -and $_.head_repository.full_name -eq $repo -and $_.conclusion -eq 'success' } |
              Sort-Object { [datetime]$_.created_at } -Descending
            if (-not $runs) { throw "no successful msix push run for $sha yet; re-run this job once it has finished" }
            $run = @($runs)[0]
            $version = $env:TAG.Substring(1) + '.0'
          } else {
            if ($env:RUN_ID -notmatch '^\d+$') { throw "msix_run_id must be a number" }
            $run = gh api "repos/$repo/actions/runs/$env:RUN_ID" | ConvertFrom-Json
            if ($run.name -ne 'msix')          { throw "run is not the msix workflow" }
            if ($run.event -ne 'push')         { throw "run was not triggered by a push" }
            if ($run.conclusion -ne 'success') { throw "run did not succeed" }
            if ($run.head_repository.full_name -ne $repo) { throw "run is from another repository" }
            $sha = $run.head_sha
            $version = ''
          }
          Write-Host "msix run $($run.id): event=$($run.event) ref=$($run.head_branch) sha=$($run.head_sha) conclusion=$($run.conclusion)"
          $cmp = gh api "repos/$repo/compare/$sha...main" | ConvertFrom-Json
          Write-Host "main vs $sha : $($cmp.status)"
          if ($cmp.status -notin @('ahead','identical')) { throw "commit $sha is not in main's history ($($cmp.status))" }
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the Store package artifact
        uses: actions/download-artifact@v4
        with:
          name: jerislink-msix-store
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store

      - name: Check the package identity and version
        id: pkg
        env:
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
        run: |
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          $file = Get-StorePackage -Dir (Join-Path $env:RUNNER_TEMP 'store') -ExpectedName $env:EXPECTED_IDENTITY_NAME `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER -ExpectedVersion $env:EXPECTED_VERSION
          "file=$file" >> $env:GITHUB_OUTPUT

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: ${{ env.STORE_CLI_VERSION }}

      - name: Sign in to Partner Center (Entra app client credentials)
        env:
          PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PC_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($n in 'PC_TENANT_ID','PC_SELLER_ID','PC_CLIENT_ID','PC_CLIENT_SECRET') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) { throw "$n is empty (store environment secret missing?)" }
          }
          msstore reconfigure --tenantId $env:PC_TENANT_ID --sellerId $env:PC_SELLER_ID --clientId $env:PC_CLIENT_ID --clientSecret $env:PC_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Stop if Partner Center already has a pending submission
        run: |
          # msstore publish deletes an existing pending submission before it creates
          # a new draft (see .github/scripts/MsStoreRunner.psm1). Never let it.
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Assert-NoPendingSubmission -ProductId $env:STORE_PRODUCT_ID

      - name: Upload to Partner Center as a draft submission (no commit, no Store release)
        env:
          PKG_FILE: ${{ steps.pkg.outputs.file }}
        run: |
          # The .msixupload file itself is the pathOrUrl argument; the CLI has no
          # --inputFile option (see .github/scripts/MsStoreRunner.psm1).
          if (-not (Test-Path -LiteralPath $env:PKG_FILE -PathType Leaf)) { throw "package file missing: $env:PKG_FILE" }
          msstore publish $env:PKG_FILE --appId $env:STORE_PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          Write-Host "Draft submission updated. Review and press Submit in Partner Center to send it to certification."

      - name: Forget the Partner Center credentials on the runner
        if: always()
        timeout-minutes: 2
        run: |
          # Not `msstore reconfigure --reset`: it asks y/n and crashes without a
          # console. This removes the same credential and files, then checks they
          # are gone and fails the step if not.
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Clear-MsStoreCliState
