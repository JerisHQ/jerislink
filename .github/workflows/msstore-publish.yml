name: msstore-publish

# Uploads the .msixupload that the `msix` workflow built for a released commit
# to Partner Center for Store product 9NM3VWQ9MD7N and COMMITS the submission:
# once committed, it goes to certification and then to the Store.
#
# Triggers
# - release `released`: a GitHub release is published as a full release (or a
#   prerelease is promoted to one). Draft releases and prereleases do not fire
#   it. release.yml creates the release as a draft on a v* tag push; publishing
#   that draft by hand is the release decision, and that is what starts this.
# - workflow_dispatch, mode=publish (fallback): give the run id of a
#   successful `msix` run.
# - workflow_dispatch, mode=diagnose: give a submission id. Read-only; see
#   "Diagnose" below. Neither the inspect nor the publish job runs.
# - workflow_dispatch, mode=delete-draft: give a submission id. Deletes that
#   one uncommitted draft only; see "Delete-draft" below. Neither the inspect
#   nor the publish job runs.
#
# Package selection: the jobs never build. They find the successful `msix` push
# run for exactly the released commit and download its jerislink-msix-store
# artifact (the bytes CI already checked, WACK-tested and sideload-installed).
# No matching run means the job fails; it never falls back to another commit.
# The commit must also be in main's history.
#
# Human gate: the `store` environment approval, and nothing after it.
# - The `inspect` job runs without the environment, before anyone approves. Its
#   log and the run summary show the package file name, Version= and SHA-256.
#   Check those before approving the `publish` job.
# - `publish` runs in the `store` environment, so its secrets are only released
#   after the environment's reviewers approve. The environment's deployment
#   policy must allow the tag ref (refs/tags/v*) for the release trigger to get
#   past it. It re-downloads the same artifact and stops unless the file and its
#   SHA-256 match what `inspect` showed.
# - Approving means shipping. Everything after approval goes straight to the
#   Store submission API (no Store CLI), and every call after create names the
#   submission id the create response returned (MsStoreRunner.psm1,
#   Publish-StoreSubmission). Which 2xx count: a GET is used only when answered
#   HTTP 200; a POST, PUT, DELETE or the upload counts as done only on HTTP
#   200, 201 or 204. HTTP 202 Accepted (or any other 2xx) means accepted,
#   completion unconfirmed (RFC 9110, 15.3.3): never taken as done, checked by
#   id where there is one, and never given re-run or delete advice. On the
#   create, PUT or upload the run stops there, uncommitted (steps 2 and 4); on
#   the commit it is read back by id like any unconfirmed commit (step 6).
#   1. GET the app: stop if any submission is pending, and GET that pending
#      submission by id to name its status. This run never deletes, changes
#      or commits a submission it did not create: for an uncommitted draft
#      (PendingCommit) the error gives its id and says a person decides what
#      happens to it (how to look at it with mode=diagnose, and the DELETE
#      for that id only as what to run if that person decides to discard
#      it); for any other status (certification, ...) it gives no delete
#      advice; when the status could not be read it covers both cases;
#   2. POST a new submission; its id comes from that response. If the service
#      refuses (any status but 2xx, 408 and 5xx, e.g. HTTP 409 when a
#      submission appeared after step 1), stop. If the POST gets no answer,
#      HTTP 408 or 5xx, the result is unconfirmed: read the app back and stop,
#      reporting only what it shows. Without an id from a create response a
#      pending submission there is of unconfirmed origin (someone may have
#      created it after step 1). If it answers HTTP 200, 201 or 204 but its id
#      cannot be read (the body was lost, or has no usable id), a submission
#      was created with an unknown id: read the app back once and stop,
#      reporting a pending submission by its id only; none shown yet (the
#      Store may be slow to show it) or a failed read-back is left to a person
#      to check. If it answers HTTP 202 or another 2xx, the create is
#      accepted, completion unconfirmed: check once (the submission by the id
#      the answer named, else the app) and stop, whatever that shows. None of
#      these gives re-run or delete advice;
#   3. GET the app again: its pending submission must be that id;
#   4. GET the submission, check its price can be sent back unchanged (the
#      log says only whether it can, never the price), PUT it
#      with every old package PendingDelete and the new .msixupload
#      PendingUpload (minimumDirectXVersion and minimumSystemRam None), then
#      PUT the zipped package to its SAS upload URL. If the PUT or the upload
#      is answered HTTP 202 or another 2xx (not 200, 201 or 204), it is
#      accepted, completion unconfirmed: read that id back once and stop,
#      uncommitted, with no delete or re-run advice;
#   5. GET it again and stop, uncommitted, unless every field other than
#      applicationPackages and friendlyName (listings, visibility, publish
#      mode and date, device families, ...) reads back as in step 4's GET
#      (Compare-SubmissionFields) and only the new package would remain
#      (Test-DraftReadyToCommit). The Store renames the draft (friendlyName)
#      and rewrites pricing on a PUT (run 45524510567: sales emptied,
#      isAdvancedPricingModel changed), so pricing is compared only on
#      priceId, trialPeriod and marketSpecificPricings, each market on its
#      own and in any order: a changed price, or a market added, removed or
#      priced differently, still stops the run. Partner Center sets
#      packageDeliveryOptions.packageRollout.packageRolloutStatus and
#      fallbackSubmissionId itself (the docs: "assigned by Partner Center"),
#      so those two are not compared either; the rest of
#      packageDeliveryOptions is. The error names the paths that differ
#      (such as pricing.priceId), never their values;
#   6. print the submission id and how to check it by hand, then POST
#      .../submissions/{id}/commit, waiting up to 60 s for the answer. If it
#      gets no answer, HTTP 408 or 5xx, an HTTP 200, 201 or 204 whose body is
#      lost (accepted, its status not read), or HTTP 202 or another 2xx
#      (accepted, completion unconfirmed, body read or not), print at once
#      that the result is unconfirmed, with that id, then read that id back up to 10 times, 30 s
#      apart, each GET waiting up to 30 s, all within 300 s (the commit API
#      is asynchronous): CommitStarted or a committed status means carry on;
#      any other status stops; still PendingCommit or no read-back means the
#      result stays unconfirmed, so stop with no delete or retry advice and
#      ask a person to check that id;
#   7. the next step reads that id back until it reaches a committed status
#      (Published included) with exactly one Uploaded package, the release's
#      version, and no other Uploaded package.
#   Any stop in steps 3-5 leaves this run's draft uncommitted. When a read in
#   steps 3-5 shows the draft is wrong (another pending id, a changed field, a
#   package left over), the error gives the exact DELETE for that id
#   (Remove-StoreDraftSubmission). When a read in steps 3-5 gives no usable
#   answer (no answer, HTTP 202 or another 2xx that is not 200, an error
#   status, an unreadable body, no usable pending id), the draft could not be
#   verified: the run stops, keeps it, and only says how to look it up by id,
#   with no delete or re-run advice. An accepted, unconfirmed PUT or upload
#   (step 4) gets no delete advice either.
#   Time budget: when a step times out the runner is killed and nothing more
#   is printed. The submit step therefore gives Publish-StoreSubmission a
#   deadline 2 min before its timeout. The last 6 min before that deadline are
#   kept for step 6 (60 s for the commit, 300 s for its read-backs): every
#   call in steps 1-5 (the upload too) waits at most until that time starts,
#   and once it has started the commit is not sent (stop uncommitted, with the
#   DELETE for that id). The id and how to check it by hand are printed before
#   the commit is sent and again as soon as its result is unconfirmed, so they
#   are in the log even if the step is killed. Every step of the publish job
#   has a timeout, and they add up to the job's, so the job timeout cannot cut
#   the submit step short.
#   A submission this workflow creates is changed, committed or deleted only
#   through the API, never in the Partner Center UI: Microsoft only takes in
#   the uploaded package on an API commit, and a submission changed in the UI
#   can no longer be committed through the API. (Up to v0.4.1 the draft was left
#   uncommitted and submitted from the UI, which shipped the 0.3.0.0 package
#   cloned from the live submission.) The only Partner Center action is Publish,
#   after certification has passed.
# - Whether a certified submission goes live by itself is its targetPublishMode
#   (cloned from the last submission). The read-back step prints it and warns
#   if it is not Manual.
# - The Store CLI is not used: `msstore publish` deletes an existing pending
#   draft, `msstore submission publish|delete` act on whatever is pending, and
#   it logs the SAS upload URL (see MsStoreRunner.psm1).
# - No step prints a token, the client secret, the SAS upload URL or raw
#   submission JSON (it holds that URL). API and upload errors are fixed text:
#   the HTTP status and allowlisted error codes, never the response body.
#   Status strings and file names from the API are checked against a pattern
#   before they are printed.
# - Web calls go only over https to login.microsoftonline.com,
#   manage.devcenter.microsoft.com and <account>.blob.core.windows.net, follow
#   no redirects, and run with verbose and debug output off (PowerShell 7.6
#   writes request URLs, headers and bodies to the debug stream).
# - Secrets reach the API only through step env vars of the steps that sign
#   in (two in publish, one in diagnose, one in delete-draft); the token stays in that step's
#   PowerShell session. Nothing is written to disk or put in the repo.
#   msstore-publish-check.yml runs the same flow against a local stand-in for
#   the API on every change to these files.
#
# Diagnose (workflow_dispatch, mode=diagnose, submission_id=<id>): the
# `diagnose` job runs in the `store` environment, so it also waits for that
# approval. It signs in, then sends GET calls only: the app, that submission
# and the app's last published submission (Show-StoreSubmissionDiagnosis). It
# prints the submission's status and which friendlyName, pricing and other
# fields differ from the last published submission, by path, never a value,
# and whether the publish run's field check would pass. The module refuses any
# call but a GET while it runs, before anything is sent, so it creates,
# changes, commits and deletes nothing.
#
# Delete-draft (workflow_dispatch, mode=delete-draft, submission_id=<id>): the
# `delete-draft` job runs in the `store` environment, so it waits for that
# approval. It signs in, then (Remove-StorePendingDraft): GETs the app (the id
# must be its pending submission and not its last published one), GETs that
# id (it must be an uncommitted PendingCommit draft), DELETEs exactly that id
# (Remove-StoreDraftSubmission, which GETs it once more first), then checks it
# is gone: a GET of that id must be HTTP 404 and the app must show no pending
# submission. Anything else stops it, and an accepted or unconfirmed DELETE is
# never reported as done or sent again. The module refuses any call but a GET
# and that one DELETE while it runs, before anything is sent, so it creates,
# changes and commits nothing, and deletes nothing else.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish: upload and commit the package of msix_run_id. diagnose: read submission_id and the last published submission (GET calls only). delete-draft: delete submission_id, only while it is the pending PendingCommit draft'
        required: true
        default: publish
        type: choice
        options:
          - publish
          - diagnose
          - delete-draft
      msix_run_id:
        description: 'mode=publish: run id of a successful "msix" push run whose commit is in main (its jerislink-msix-store artifact is uploaded)'
        required: false
        type: string
      submission_id:
        description: 'mode=diagnose: the submission id to read; mode=delete-draft: the draft to delete (digits only)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: msstore-publish
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9NM3VWQ9MD7N
  EXPECTED_IDENTITY_NAME: jerisHQ.JerisLink
  EXPECTED_PUBLISHER: CN=89A018EB-5C52-49CB-B478-B462FA6B08DD

jobs:
  # No environment: runs before the approval, so the approver can see exactly
  # which package the publish job would upload.
  inspect:
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        && !github.event.release.draft && !github.event.release.prerelease)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        && inputs.mode == 'publish')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    outputs:
      run_id: ${{ steps.src.outputs.run_id }}
      sha: ${{ steps.src.outputs.sha }}
      file_name: ${{ steps.pkg.outputs.file_name }}
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Find the msix run for this commit and check the commit is in main
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_ID: ${{ inputs.msix_run_id }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          # Only fixed text and values of a fixed shape from the GitHub API
          # reach the log or the outputs (Pepper, PR #74 r8 and r9). gh's error
          # output (the API's message) is kept out of the log. An answer that
          # is not exactly one complete JSON object (Test-JsonObject: a key
          # given twice at any depth, also in another case, text before or after
          # it, a comment, a bad literal, an array) or a field that is missing,
          # not text or of another shape stops the job with fixed text: a
          # parser's or a cast's own message can quote the answer, so every error
          # but this step's own (Stop-Lookup) is replaced by fixed text. The
          # branch of the run is never printed, only whether it is main or this
          # release's tag.
          # Each path below holds only values checked before it is built.
          function Stop-Lookup([string]$Text) { $e = [System.InvalidOperationException]::new($Text); $e.Data['Lookup'] = $true; throw $e }
          # True when Text is exactly one complete JSON object as System.Text.Json
          # reads it by default (nothing before or after it, no comments, trailing
          # commas or single quotes, all of which ConvertFrom-Json takes) in which
          # no object, at any depth, has a key twice, also not in another case
          # (ConvertFrom-Json keeps the last of two equal keys; a lookup here does
          # not tell them apart). Pepper, PR #74 r10. Never throws.
          function Test-JsonObject([string]$Text) {
            $doc = $null
            try {
              $doc = [System.Text.Json.JsonDocument]::Parse($Text)
              if ($doc.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) { return $false }
              $todo = [System.Collections.Generic.Stack[System.Text.Json.JsonElement]]::new()
              $todo.Push($doc.RootElement)
              while ($todo.Count -gt 0) {
                $e = $todo.Pop()
                if ($e.ValueKind -eq [System.Text.Json.JsonValueKind]::Object) {
                  $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                  foreach ($p in $e.EnumerateObject()) { if (-not $seen.Add($p.Name)) { return $false }; $todo.Push($p.Value) }
                } elseif ($e.ValueKind -eq [System.Text.Json.JsonValueKind]::Array) {
                  foreach ($i in $e.EnumerateArray()) { $todo.Push($i) }
                }
              }
              $true
            } catch { $false } finally { if ($null -ne $doc) { $doc.Dispose() } }
          }
          function Invoke-GitHubApi([string]$Path) {
            $out = gh api $Path 2>$null
            if ($LASTEXITCODE -ne 0) { Stop-Lookup "GitHub API GET $Path failed (gh exit code $LASTEXITCODE; its answer is not printed)" }
            $o = $null
            $text = $out -join "`n"
            if (Test-JsonObject $text) { try { $o = ConvertFrom-Json -InputObject $text -NoEnumerate -ErrorAction Stop } catch { } }
            if ($o -isnot [System.Management.Automation.PSCustomObject]) { Stop-Lookup "the GitHub API answer to GET $Path is not one JSON object that parses (not printed)" }
            $o
          }
          # A field by its exact name: its value, or $null when it is missing.
          function Get-Field($Object, [string]$Name) {
            if ($Object -isnot [System.Management.Automation.PSCustomObject]) { return $null }
            $p = $Object.PSObject.Properties[$Name]
            if ($p -and $p.Name -ceq $Name) { , $p.Value }
          }
          # A field as text: '' when it is missing, null or not a JSON string.
          function Get-Text($Object, [string]$Name) {
            $v = Get-Field $Object $Name
            if ($v -is [string]) { $v } else { '' }
          }
          # The run id (GitHub sends a JSON number), as digits, or ''.
          function Get-RunId($Run) {
            $v = Get-Field $Run 'id'
            if (($v -is [long] -or $v -is [int]) -and $v -gt 0) { [string]$v } else { '' }
          }
          # created_at as a UTC date: ConvertFrom-Json makes GitHub's ISO 8601
          # text a [datetime]; anything else stops with fixed text.
          function Get-RunDate($Run) {
            $v = Get-Field $Run 'created_at'
            $d = [datetime]::MinValue
            if ($v -is [datetime]) { return $v.ToUniversalTime() }
            if ($v -is [string] -and [datetime]::TryParseExact($v, 'yyyy-MM-ddTHH:mm:ssZ', [cultureinfo]::InvariantCulture,
                [System.Globalization.DateTimeStyles]'AssumeUniversal, AdjustToUniversal', [ref]$d)) { return $d }
            Stop-Lookup 'a run in the GitHub API answer has no created_at date (not printed)'
          }
          try {
            if ($env:EVENT -eq 'release') {
              if ($env:TAG -cnotmatch '^v[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}\z') { Stop-Lookup 'the release tag is not vMAJOR.MINOR.PATCH (not printed)' }
              $sha = Get-Text (Invoke-GitHubApi "repos/$repo/commits/$env:TAG") 'sha'
              if ($sha -cnotmatch '^[0-9a-f]{40}\z') { Stop-Lookup "the GitHub API answered no commit sha for tag $env:TAG (its answer is not printed)" }
              if ($sha -cne $env:GITHUB_SHA) { Stop-Lookup "tag $env:TAG points at $sha, but the event is for $env:GITHUB_SHA" }
              $list = Get-Field (Invoke-GitHubApi "repos/$repo/actions/workflows/msix.yml/runs?head_sha=$sha&event=push&status=success&per_page=20") 'workflow_runs'
              if ($list -isnot [array]) { Stop-Lookup 'the GitHub API answer has no list of workflow runs (not printed)' }
              $runs = @(@(foreach ($r in $list) {
                if ((Get-Text $r 'head_sha') -ceq $sha -and (Get-Text (Get-Field $r 'head_repository') 'full_name') -eq $repo -and
                    (Get-Text $r 'event') -ceq 'push' -and (Get-Text $r 'conclusion') -ceq 'success') {
                  [pscustomobject]@{ Run = $r; Date = Get-RunDate $r }
                }
              }) | Sort-Object Date -Descending)
              if ($runs.Count -eq 0) { Stop-Lookup "no successful msix push run for $sha yet; re-run this job once it has finished" }
              $run = $runs[0].Run
              $version = $env:TAG.Substring(1) + '.0'
            } else {
              if ($env:RUN_ID -cnotmatch '^[0-9]{1,20}\z') { Stop-Lookup 'msix_run_id must be a number' }
              $run = Invoke-GitHubApi "repos/$repo/actions/runs/$env:RUN_ID"
              if ((Get-RunId $run) -cne $env:RUN_ID)            { Stop-Lookup "the GitHub API did not answer with run $env:RUN_ID" }
              if ((Get-Text $run 'name') -cne 'msix')           { Stop-Lookup 'run is not the msix workflow' }
              if ((Get-Text $run 'event') -cne 'push')          { Stop-Lookup 'run was not triggered by a push' }
              if ((Get-Text $run 'conclusion') -cne 'success')  { Stop-Lookup 'run did not succeed' }
              if ((Get-Text (Get-Field $run 'head_repository') 'full_name') -ne $repo) { Stop-Lookup 'run is from another repository' }
              $sha = Get-Text $run 'head_sha'
              $version = ''
            }
            $runId = Get-RunId $run
            if ($runId -cnotmatch '^[0-9]{1,20}\z' -or $sha -cnotmatch '^[0-9a-f]{40}\z') {
              Stop-Lookup 'the GitHub API answered a run id or commit sha of an unexpected shape (not printed)'
            }
            $branch = Get-Text $run 'head_branch'
            $ref = if ($branch -ceq 'main') { 'main' } elseif ($env:TAG -and $branch -ceq $env:TAG) { $env:TAG } else { '[not shown]' }
            Write-Host "msix run ${runId}: event=push ref=$ref sha=$sha conclusion=success"
            $status = Get-Text (Invoke-GitHubApi "repos/$repo/compare/$sha...main") 'status'
            $ahead = if ($status -cin @('ahead', 'identical', 'behind', 'diverged')) { $status } else { '[unlisted]' }
            Write-Host "main vs $sha : $ahead"
            if ($ahead -cnotin @('ahead', 'identical')) { Stop-Lookup "commit $sha is not in main's history ($ahead)" }
            "run_id=$runId" >> $env:GITHUB_OUTPUT
            "sha=$sha" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          } catch {
            if ($_.Exception.Data['Lookup']) { throw }
            throw 'the msix run lookup failed; its error message is not printed (it can quote the GitHub API answer)'
          }

      - name: Download the Store package artifact
        uses: actions/download-artifact@v4
        with:
          name: jerislink-msix-store
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store

      - name: Check the package identity and version
        id: pkg
        env:
          EXPECTED_VERSION: ${{ steps.src.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          $p = Get-StorePackage -Dir (Join-Path $env:RUNNER_TEMP 'store') -ExpectedName $env:EXPECTED_IDENTITY_NAME `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER -ExpectedVersion $env:EXPECTED_VERSION
          Write-Host "Package to publish after approval: $($p.FileName) Version=$($p.Version) SHA256=$($p.Sha256)"
          @(
            '### Store package waiting for approval'
            ''
            "- Tag: ``$(if ($env:TAG) { $env:TAG } else { '(workflow_dispatch)' })``"
            "- msix run: ${{ steps.src.outputs.run_id }} (commit ``${{ steps.src.outputs.sha }}``)"
            "- File: ``$($p.FileName)``"
            "- Version=``$($p.Version)``"
            "- SHA-256: ``$($p.Sha256)``"
            ''
            'Approving the `publish` job uploads this package and commits the Store submission (certification, then the Store). The submission is changed and committed only through the API: do not press Submit or edit it in Partner Center. The only Partner Center action is Publish, after certification.'
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
          "file_name=$($p.FileName)" >> $env:GITHUB_OUTPUT
          "version=$($p.Version)" >> $env:GITHUB_OUTPUT
          "sha256=$($p.Sha256)" >> $env:GITHUB_OUTPUT

  publish:
    needs: inspect
    runs-on: windows-latest
    environment: store
    # The step timeouts add up to this (checked by msstore-publish-check.yml):
    # checkout 5 + download 10 + package check 5 + create, upload and commit 20
    # + read-back 35 min.
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the Store package artifact
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: jerislink-msix-store
          run-id: ${{ needs.inspect.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store

      - name: Check it is the package the approver saw
        id: pkg
        timeout-minutes: 5
        env:
          EXPECTED_FILE: ${{ needs.inspect.outputs.file_name }}
          EXPECTED_SHA256: ${{ needs.inspect.outputs.sha256 }}
        run: |
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          if (-not $env:EXPECTED_VERSION -or -not $env:EXPECTED_FILE -or -not $env:EXPECTED_SHA256) { throw "inspect job outputs are missing" }
          $p = Get-StorePackage -Dir (Join-Path $env:RUNNER_TEMP 'store') -ExpectedName $env:EXPECTED_IDENTITY_NAME `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER -ExpectedVersion $env:EXPECTED_VERSION
          if ($p.FileName -cne $env:EXPECTED_FILE) { throw "package file $($p.FileName) is not the one shown before approval ($env:EXPECTED_FILE)" }
          if ($p.Sha256 -ne $env:EXPECTED_SHA256) { throw "package SHA-256 differs from the one shown before approval" }
          Write-Host "Publishing $($p.FileName) Version=$($p.Version) SHA256=$($p.Sha256)"
          "file=$($p.Path)" >> $env:GITHUB_OUTPUT

      - name: Create the submission, upload, check and commit it (Store API, by submission id; the store approval was the human gate)
        id: submit
        timeout-minutes: 20
        env:
          PKG_FILE: ${{ steps.pkg.outputs.file }}
          PKG_NAME: ${{ needs.inspect.outputs.file_name }}
          PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          # No call waits past this deadline, 2 min before timeout-minutes (20)
          # above, so the result and the id are printed before the runner is
          # killed (checked by msstore-publish-check.yml).
          $deadline = [DateTime]::UtcNow.AddMinutes(18)
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET
          $id = Publish-StoreSubmission -ProductId $env:STORE_PRODUCT_ID -PackagePath $env:PKG_FILE -ExpectedFileName $env:PKG_NAME -ExpectedVersion $env:EXPECTED_VERSION -DeadlineUtc $deadline
          if ($id -isnot [string] -or $id -cnotmatch '^[0-9]{1,20}\z') { throw "submission id is not a number" }
          "submission_id=$id" >> $env:GITHUB_OUTPUT

      - name: Read the submission back by its id and fail unless it holds the new package
        timeout-minutes: 35
        env:
          SUBMISSION_ID: ${{ steps.submit.outputs.submission_id }}
          PKG_NAME: ${{ needs.inspect.outputs.file_name }}
          PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          # The file name shown before approval: the log prints a package's
          # file name only when it is exactly this one.
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET
          Assert-SubmissionHasPackage -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID -ExpectedVersion $env:EXPECTED_VERSION -ExpectedFileName $env:PKG_NAME -TimeoutMinutes 30 -IntervalSeconds 60

  # mode=diagnose (see "Diagnose" above): GET calls only. It is in the store
  # environment because it signs in with its secrets, so it waits for the same
  # approval as a publish. It never runs on a release.
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'diagnose'
    runs-on: windows-latest
    environment: store
    # checkout 5 + diagnose 5 min (sign-in and three GET calls of up to 60 s).
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Read the submission and the last published submission (GET calls only) and print which fields differ, by path, never values
        id: diagnose
        timeout-minutes: 5
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          # The id is checked before the sign-in. While it runs,
          # Show-StoreSubmissionDiagnosis refuses any call but a GET to the
          # Store API, before it is sent.
          if ($env:SUBMISSION_ID -cnotmatch '^[0-9]{1,20}\z') { throw 'submission_id must be a number' }
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET
          Show-StoreSubmissionDiagnosis -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID

  # mode=delete-draft (see "Delete-draft" above): GET calls and one DELETE of
  # that submission id only. In the store environment, so it waits for the
  # same approval as a publish. It never runs on a release.
  delete-draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'delete-draft'
    runs-on: windows-latest
    environment: store
    # checkout 5 + delete 5 min (sign-in, then calls of up to 30 s each, none
    # past the step's deadline).
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Delete that one uncommitted draft by id (only while it is the app's pending PendingCommit draft), then check it is gone
        id: delete-draft
        timeout-minutes: 5
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          # No call waits past this deadline, 1 min before timeout-minutes (5)
          # above. The id is checked before the sign-in. While it runs,
          # Remove-StorePendingDraft refuses any call but a GET to the Store
          # API and one DELETE of that submission, before it is sent.
          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          if ($env:SUBMISSION_ID -cnotmatch '^[0-9]{1,20}\z') { throw 'submission_id must be a number' }
          Import-Module ./.github/scripts/MsStoreRunner.psm1
          Connect-StoreApi -TenantId $env:PC_TENANT_ID -ClientId $env:PC_CLIENT_ID -ClientSecret $env:PC_CLIENT_SECRET
          Remove-StorePendingDraft -ProductId $env:STORE_PRODUCT_ID -SubmissionId $env:SUBMISSION_ID -DeadlineUtc $deadline
