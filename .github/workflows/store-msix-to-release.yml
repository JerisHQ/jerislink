name: store-msix-to-release

# Attaches the Microsoft Store-signed MSIX of JerisLink (Store product
# 9NM3VWQ9MD7N) to the GitHub release of the same version, so people can install
# a signed Windows build without the Store and without trusting a test cert.
#
# How
# - fetch (ubuntu, contents: read): .github/scripts/store-msix-fetch.mjs asks
#   DCAT for the x64 package (version, SHA-256, size), gets the download URL from
#   FE3 (TLS pinned to Microsoft Root Certificate Authority 2011) and downloads
#   it. The file must match the DCAT size and SHA-256 or the job fails. No
#   third-party action or tool is involved.
# - verify (windows, contents: read): same SHA-256 as fetch; Identity
#   jerisHQ.JerisLink x64 from publisher CN=89A018EB-...; Authenticode status
#   Valid on a clean runner; signer subject = publisher, issued by a Microsoft
#   Marketplace CA, chain root = Microsoft Root Certificate Authority 2011 (by
#   thumbprint); not our self-signed sideload test certificate. Then its version
#   must equal the tag (v0.4.1 -> 0.4.1.0). If the Store still serves an older
#   version, nothing is uploaded and the run ends green with a notice.
# - upload (ubuntu, the only job with contents: write): runs only for a manual
#   dispatch from main, only when verify said ready. It uploads one new asset,
#   Jerislink-<ver>-windows-x64-store-signed.msix, without --clobber, and skips if
#   that asset is already there.
#
# SHA256SUMS.txt is not rewritten: GitHub can only replace an asset by deleting
# it first, which would leave the release without its checksum file if the
# re-upload failed. The SHA-256 of the MSIX is in the run summary instead.
#
# Pull requests that touch these files run fetch and verify against the live
# Store package (read-only; upload never runs on pull_request).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the Store-signed MSIX to, e.g. v0.4.1'
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/store-msix-to-release.yml
      - .github/scripts/store-msix-fetch.mjs

permissions:
  contents: read

concurrency:
  group: store-msix-to-release
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9NM3VWQ9MD7N
  EXPECTED_IDENTITY_NAME: jerisHQ.JerisLink
  EXPECTED_PUBLISHER: CN=89A018EB-5C52-49CB-B478-B462FA6B08DD
  EXPECTED_ARCH: x64
  STORE_PFN: jerisHQ.JerisLink_1cbzj2979sfxw
  # SHA-1 of personal/windows-client/msix/JerisLink-sideload-test.cer
  TEST_CERT_THUMBPRINT: 5E6E211F60E17FFD44F7772BE0E8C11E40DD6661
  # SHA-1 of Microsoft Root Certificate Authority 2011 (Store signing root)
  MS_ROOT_2011_THUMBPRINT: 8F43288AD272F3103B6FB1428485EA3014C0BCFE

jobs:
  # fetch is the only job that talks to the Store. Its contract is the outputs
  # below plus one artifact named `store-msix` holding `store.msix`.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      asset: ${{ steps.tag.outputs.asset }}
      skip: ${{ steps.tag.outputs.skip }}
      sha256: ${{ steps.dl.outputs.sha256 }}
    steps:
      - name: Resolve the tag and check the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            v=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' | tr -d '[:space:]')
            tag="v$v"
          fi
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1; fi
          ver="${BASH_REMATCH[1]}"
          asset="Jerislink-$ver-windows-x64-store-signed.msix"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver.0" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          skip=false
          if names=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qxF "$asset" <<<"$names"; then skip=true; echo "::notice::$tag already has $asset; nothing to do"; fi
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "::error::no GitHub release $tag"; exit 1
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "tag=$tag expected=$ver.0 asset=$asset skip=$skip"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.tag.outputs.skip != 'true'
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download from the Store and check against DCAT
        id: dl
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node --version
          node .github/scripts/store-msix-fetch.mjs "$STORE_PRODUCT_ID" "$STORE_PFN" "$RUNNER_TEMP/out" > "$RUNNER_TEMP/fetch.out"
          cat "$RUNNER_TEMP/fetch.out"
          grep -E '^(version|sha256|size|full_name)=' "$RUNNER_TEMP/fetch.out" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/out/store.msix"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.tag.outputs.skip != 'true'
        with:
          name: store-msix
          path: ${{ runner.temp }}/out/store.msix
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: fetch
    if: needs.fetch.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha256: ${{ steps.check.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: store-msix
          path: ${{ runner.temp }}/in

      - name: Check identity, Store signature and version
        id: check
        env:
          EXPECTED_VERSION: ${{ needs.fetch.outputs.version }}
          FETCH_SHA256: ${{ needs.fetch.outputs.sha256 }}
          TAG: ${{ needs.fetch.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Join-Path $env:RUNNER_TEMP 'in\store.msix'
          $sha = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:FETCH_SHA256) { throw "artifact SHA-256 $sha is not the DCAT-checked $($env:FETCH_SHA256)" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($f)
          try {
            $e = $zip.GetEntry('AppxManifest.xml')
            if (-not $e) { throw "no AppxManifest.xml (bundle or not an MSIX?)" }
            $r = New-Object IO.StreamReader($e.Open()); [xml]$m = $r.ReadToEnd(); $r.Dispose()
          } finally { $zip.Dispose() }
          $id = $m.Package.Identity
          Write-Host "Identity Name=$($id.Name) Publisher=$($id.Publisher) Version=$($id.Version) Arch=$($id.ProcessorArchitecture)"
          if ($id.Name -cne $env:EXPECTED_IDENTITY_NAME) { throw "unexpected Identity Name" }
          if ($id.Publisher -cne $env:EXPECTED_PUBLISHER) { throw "unexpected Identity Publisher" }
          if ($id.ProcessorArchitecture -ne $env:EXPECTED_ARCH) { throw "unexpected architecture" }

          # Authenticode over the whole package (AppxSip). The runner trusts
          # Microsoft roots and has never seen our test certificate.
          $sig = Get-AuthenticodeSignature -LiteralPath $f
          $cert = $sig.SignerCertificate
          Write-Host "Authenticode: $($sig.Status) $($sig.StatusMessage)"
          if ($sig.Status -ne 'Valid' -or -not $cert) { throw "signature status is $($sig.Status), not Valid" }
          Write-Host "Signer: $($cert.Subject) | issuer $($cert.Issuer) | $($cert.Thumbprint)"
          if ($cert.Thumbprint -eq $env:TEST_CERT_THUMBPRINT) { throw "signed with the sideload test certificate" }
          if ($cert.Subject -eq $cert.Issuer) { throw "signer certificate is self-signed" }
          if ($cert.Subject -cne $env:EXPECTED_PUBLISHER) { throw "signer subject is not the package publisher" }
          if ($cert.Issuer -notmatch '^CN=Microsoft Marketplace CA G \d+, OU=AOC, O=Microsoft Corporation,') { throw "signer issuer is not a Microsoft Marketplace CA" }
          $chain = New-Object Security.Cryptography.X509Certificates.X509Chain
          $chain.ChainPolicy.RevocationMode = 'NoCheck'
          # Store signing certificates are short-lived and usually expired by now;
          # Authenticode above already accepted the timestamped signature. The
          # chain is only used to prove which root the signer comes from.
          $chain.ChainPolicy.VerificationFlags = 'IgnoreNotTimeValid'
          if (-not $sig.TimeStamperCertificate) { throw "signature has no timestamp" }
          if (-not $chain.Build($cert)) { throw "chain does not build: $(($chain.ChainStatus | ForEach-Object Status) -join ', ')" }
          $chain.ChainElements | ForEach-Object { Write-Host "  chain: $($_.Certificate.Subject) | $($_.Certificate.Thumbprint)" }
          $root = $chain.ChainElements[$chain.ChainElements.Count - 1].Certificate
          if ($root.Thumbprint -ne $env:MS_ROOT_2011_THUMBPRINT) { throw "chain root is not Microsoft Root Certificate Authority 2011: $($root.Subject) $($root.Thumbprint)" }

          $ready = ($id.Version -eq $env:EXPECTED_VERSION)
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          $note = if ($ready) { "version matches $env:TAG" } else { "Store serves $($id.Version), not $env:EXPECTED_VERSION yet: nothing uploaded" }
          if (-not $ready) { Write-Host "::notice::$note" }
          @(
            "### Store-signed MSIX for $env:TAG",
            "",
            "| | |", "|---|---|",
            "| Store version | $($id.Version) |",
            "| Expected | $env:EXPECTED_VERSION |",
            "| Result | $note |",
            "| Signer | $($cert.Subject) |",
            "| Issuer | $($cert.Issuer) |",
            "| Root | $($root.Subject) |",
            "| SHA-256 | ``$sha`` |"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

  upload:
    needs: [fetch, verify]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: store-msix
          path: ${{ runner.temp }}/in

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.fetch.outputs.tag }}
          ASSET: ${{ needs.fetch.outputs.asset }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/$ASSET"
          mv "$RUNNER_TEMP/in/store.msix" "$f"
          got=$(sha256sum "$f" | cut -d' ' -f1)
          [ "$got" = "$SHA256" ] || { echo "::error::artifact hash $got is not the verified $SHA256"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$ASSET"; then
            echo "::notice::$TAG already has $ASSET"; exit 0
          fi
          gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $ASSET to $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA256  $ASSET\`" >> "$GITHUB_STEP_SUMMARY"
