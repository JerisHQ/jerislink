name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: personal/windows-client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (unsigned)
        run: cmake --build build --config Release --target Jerislink
      - uses: actions/upload-artifact@v4
        with:
          name: jerislink-windows-unsigned
          path: personal/windows-client/build/Release/Jerislink.exe
      - name: Build settings UI snapshot (CI only, not packaged)
        run: cmake --build build --config Release --target JerislinkUiSnapshot
      - name: UI snapshots and no-freeze checks (launch screen, overlay, settings, volume)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Jeris\Jerislink'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name HostIp -Value '100.64.0.10' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoCodec -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoBitrateMbps -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name AudioVolumePercent -Value 70 -PropertyType DWord -Force | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'ui-snapshots'
          $codes = @{}
          foreach ($accent in 'green', 'blue') {
            $dir = Join-Path $root $accent
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $log = Join-Path $dir 'snapshot.txt'
            $p = Start-Process build\Release\JerislinkUiSnapshot.exe -ArgumentList $dir, $accent -PassThru -RedirectStandardOutput $log
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "snapshot $accent did not exit" }
            Get-Content $log -ErrorAction SilentlyContinue
            $codes[$accent] = $p.ExitCode
          }
          Remove-Item -Path $key -Recurse -Force
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem $root -Recurse -Filter *.bmp | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "$($_.Directory.Name)/$($_.Name) $($img.Width)x$($img.Height)"
            $img.Dispose()
            Remove-Item $_.FullName
          }
          foreach ($accent in $codes.Keys) {
            if ($codes[$accent] -ne 0) { throw "snapshot $accent exit $($codes[$accent])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: jerislink-ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
      - name: Build overlay unit test
        run: cmake --build build --config Release --target JerislinkOverlayTest
      - name: Overlay unit test (layout, hit-test, keyboard focus, slider, hover dwell)
        run: build\Release\JerislinkOverlayTest.exe
      - name: Build launch-config unit test
        run: cmake --build build --config Release --target JerislinkOptionsTest
      - name: Launch-config unit test
        run: build\Release\JerislinkOptionsTest.exe
      - name: Build receiver / NACK unit test
        run: cmake --build build --config Release --target JerislinkReceiverTest
      - name: Receiver / NACK unit test (loss simulation, NACK on vs off)
        run: build\Release\JerislinkReceiverTest.exe
      - name: Build loop wait test
        run: cmake --build build --config Release --target JerislinkLoopWaitTest
      - name: Loop wait test (MRM1 wake, timer period before/after)
        run: build\Release\JerislinkLoopWaitTest.exe
      - name: Build viewer log test
        run: cmake --build build --config Release --target JerislinkLogTest
      - name: Viewer log test (order, size caps, legacy history trim, caller cost before/after)
        run: build\Release\JerislinkLogTest.exe
      - name: Build mouse button parity test
        run: cmake --build build --config Release --target JerislinkMouseButtonsTest
      - name: Mouse button parity test (every down gets one up; focus kill, capture lost)
        run: build\Release\JerislinkMouseButtonsTest.exe
      - name: Build H.264 NAL summary test
        run: cmake --build build --config Release --target JerislinkNalSummaryTest
      - name: H.264 NAL summary test (slice first_mb / type, Annex B split, log budget)
        run: build\Release\JerislinkNalSummaryTest.exe
      - name: Build keymap golden test
        run: cmake --build build --config Release --target JerislinkKeymapTest
      - name: Keymap golden test (Mac and Windows presets, Ctrl+A/C/V/X/Z/S/F, Ctrl+Y redo, Win+C / Win+Space, Alt+Tab, viewer hotkeys, focus-loss release, live preset switch)
        run: build\Release\JerislinkKeymapTest.exe
      - name: Build file wire codec test
        run: cmake --build build --config Release --target JerislinkFileProtoTest
      - name: Build received-path safety test
        run: cmake --build build --config Release --target JerislinkFilePathTest
      - name: File wire codec test (0x50-0x5C round trip, strict lengths, byte layout shared with the Mac host)
        run: build\Release\JerislinkFileProtoTest.exe
      - name: Received-path safety test (traversal, absolute, drive, reserved names and chars, NFC, length and depth limits, clash names)
        run: build\Release\JerislinkFilePathTest.exe
      - name: Build paste upload test
        run: cmake --build build --config Release --target JerislinkFileUploadTest
      - name: Paste upload test (Cmd+V hold in both presets, 3 s window, focus loss, pacer, chip and confirm text, confirm keys)
        run: build\Release\JerislinkFileUploadTest.exe
      - name: Build Files panel test
        run: cmake --build build --config Release --target JerislinkFilePanelTest
      - name: Files panel test (F4/F5a two cards, Send to setup lines, tip by host caps, last transfer, Cancel / Open folder, layout at 96-288 dpi, keys)
        run: build\Release\JerislinkFilePanelTest.exe
      - name: Build Send to test
        run: cmake --build build --config Release --target JerislinkSendToTest
      - name: Send to test (F5a --send-to arguments, path checks, decision like a drop, dialog texts, exit codes, pipe bytes and limits)
        run: build\Release\JerislinkSendToTest.exe
      - name: Build Send to pipe test
        run: cmake --build build --config Release --target JerislinkSendToPipeTest
      - name: Send to pipe test (real named pipe, paths round trip, first instance, this-user DACL, corrupt / idle / slow peers, quiet exit)
        timeout-minutes: 3
        run: build\Release\JerislinkSendToPipeTest.exe
      - name: Build Store Explorer command test
        run: cmake --build build --config Release --target JerislinkSendToShellTest
      - name: Store Explorer command test (JerisLinkSendTo.dll COM factory, title, icon, state, Invoke starts Jerislink.exe --send-to with the exact paths)
        timeout-minutes: 3
        run: build\Release\JerislinkSendToShellTest.exe build\Release\JerisLinkSendTo.dll
      - name: Build connection password test
        run: cmake --build build --config Release --target JerislinkConnAuthTest
      - name: Connection password test (shared vectors, NFC, mutual check, DPAPI round trip, no file when Remember is off, saved key deleted on fail, locked / blocked / auth_required, 0.3.x host 2 s timeout, transition probe and probe race, every channel on its own, PBKDF2 once, open_ip_only after a proof, HMAC failure, split header, one channel at a time, distrusted saved key, secrets wiped)
        run: build\Release\JerislinkConnAuthTest.exe ..\protocol\auth_vectors.json
      - name: Build launch screen password test
        run: cmake --build build --config Release --target JerislinkAuthUiTest
      - name: Launch screen password test (tries left, locked M min S s countdown with Connect greyed out, blocked, auth_required, host too old, focus back to the password field, probe race, local error, relaunch handoff)
        run: build\Release\JerislinkAuthUiTest.exe
      - name: Build control reconnect test
        run: cmake --build build --config Release --target JerislinkControlReconnectTest
      - name: Control reconnect test (reconnect and connection password off the UI thread, input never waits, queued events in order, Locked from a background reconnect)
        timeout-minutes: 3
        run: build\Release\JerislinkControlReconnectTest.exe
      - name: Send to with no viewer running (Jerislink.exe --send-to, quiet, exit 21, no window)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path build\Release\Jerislink.exe).Path
          $file = Join-Path $env:RUNNER_TEMP 'send to test.txt'
          Set-Content -Path $file -Value 'F5a'
          $env:JERISLINK_SENDTO_QUIET = '1'
          $p = Start-Process $exe -ArgumentList @('--send-to', "`"$file`"") -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Jerislink.exe --send-to did not exit' }
          Write-Host "exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 21) { throw "expected exit 21 (not connected), got $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList @('--send-to') -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Jerislink.exe --send-to (nothing) did not exit' }
          if ($p.ExitCode -ne 27) { throw "expected exit 27 (nothing selected), got $($p.ExitCode)" }
          Write-Host 'OK: --send-to answers without a viewer and opens no window'
      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version 6.7.1 -y --no-progress
      - name: Installer adds and removes Send to > JerisLink (silent per-user install, shortcut target and arguments, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc Jerislink.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = Get-ChildItem dist -Filter 'Jerislink-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no setup exe' }
          $dir = Join-Path $env:RUNNER_TEMP 'jl-install'
          $lnk = Join-Path ([Environment]::GetFolderPath('SendTo')) 'JerisLink.lnk'
          if (Test-Path $lnk) { throw "Send to shortcut exists before install: $lnk" }
          $p = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"") -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'setup did not exit' }
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          if (-not (Test-Path $lnk)) { throw "no Send to shortcut at $lnk" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "target: $($sc.TargetPath)"; Write-Host "arguments: $($sc.Arguments)"
          if ($sc.TargetPath -ne (Join-Path $dir 'Jerislink.exe')) { throw 'shortcut target is not the installed Jerislink.exe' }
          if ($sc.Arguments -ne '--send-to') { throw "shortcut arguments: '$($sc.Arguments)'" }
          # What Explorer runs for Send to: the shortcut's target and arguments, then the selected paths.
          $file = Join-Path $env:RUNNER_TEMP 'send to via shortcut.txt'
          Set-Content -Path $file -Value 'F5a'
          $env:JERISLINK_SENDTO_QUIET = '1'
          $p = Start-Process $sc.TargetPath -ArgumentList @($sc.Arguments, "`"$file`"") -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'installed --send-to did not exit' }
          if ($p.ExitCode -ne 21) { throw "installed --send-to: expected exit 21, got $($p.ExitCode)" }
          $p = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'uninstall did not exit' }
          for ($i = 0; $i -lt 30 -and (Test-Path $lnk); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $lnk) { throw 'Send to shortcut still there after uninstall' }
          Write-Host 'OK: installer adds Send to > JerisLink (--send-to) and uninstall removes it'
      - uses: actions/upload-artifact@v4
        with:
          name: jerislink-windows-setup-unsigned
          path: personal/windows-client/dist/Jerislink-*-windows-x64-setup.exe
      - name: Build paste pull test
        run: cmake --build build --config Release --target JerislinkFilePullTest
      - name: Paste pull test (announce checks, Windows names, request window, stale drain, hold-back until SHA-256, cancel and failure)
        run: build\Release\JerislinkFilePullTest.exe
      - name: Build paste Mark of the Web test
        run: cmake --build build --config Release --target JerislinkFileZoneTest
      - name: Paste Mark of the Web test (Zone.Identifier helpers, shell paste of mapped names, ZoneId=3 on delivered files)
        timeout-minutes: 3
        run: build\Release\JerislinkFileZoneTest.exe
      - name: Build Mac push test
        run: cmake --build build --config Release --target JerislinkFilePushTest
      - name: Mac push test (files only, 1000 max, request window, hash before naming, busy, cancel, disconnect, name (2).ext, ZoneId=3, no .jlpart left)
        timeout-minutes: 3
        run: build\Release\JerislinkFilePushTest.exe
      - name: No always-on shortcut or key log lines in the viewer
        shell: pwsh
        run: |
          $hits = Select-String -Path viewer.cpp -Pattern 'logLine\("(shortcut\.|key\.)'
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw "shortcut/key log lines must go through sendKeyOutput (JERISLINK_DEBUG=1 only)" }
          Write-Host "OK: no direct shortcut./key. log lines in viewer.cpp"
      - name: Build audio jitter test
        run: cmake --build build --config Release --target JerislinkAudioTest
      - name: Audio jitter test (MRA1 v1/v2 parse, Opus round trip, PLC, FEC, drift control, A1 vs A2 link simulation)
        run: build\Release\JerislinkAudioTest.exe
      - name: Saved settings drive a launch without connection arguments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Jeris\Jerislink'
          $exe = (Resolve-Path build\Release\Jerislink.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'jerislink-config.txt'
          function Invoke-PrintConfig([string[]]$extra) {
            Remove-Item $out -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList ($extra + @('--print-config', $out)) -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Jerislink.exe did not exit (dialog shown?)' }
            $text = Get-Content $out -Raw
            Write-Host "args: $extra exit: $($p.ExitCode)"; Write-Host $text
            return @{ Exit = $p.ExitCode; Text = $text }
          }
          function Assert-Has($r, [string[]]$lines) {
            foreach ($l in $lines) { if ($r.Text -notmatch "(?m)^$([regex]::Escape($l))\r?$") { throw "missing '$l'" } }
          }
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name HostIp -Value '192.0.2.25' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name BindIp -Value '198.51.100.16' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoCodec -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoBitrateMbps -Value 18 -PropertyType DWord -Force | Out-Null

          # Only the diagnostic flag: host, codec and bitrate come from the saved
          # settings. This PC's address is never saved: the BindIp left by an
          # older build is ignored, and the runner has no tailnet, so the launch
          # stops at no-tailnet (exit 3).
          $r = Invoke-PrintConfig @()
          if ($r.Exit -ne 3) { throw "expected exit 3, got $($r.Exit)" }
          Assert-Has $r @('status=no-tailnet', 'host=192.0.2.25', 'host_source=saved', 'bind=', 'bind_source=none', 'codec=hevc', 'bitrate_mbps=18')

          # This PC's address on the command line: the saved settings drive the rest.
          $r = Invoke-PrintConfig @('--bind-ip', '198.51.100.16')
          if ($r.Exit -ne 0) { throw "exit $($r.Exit)" }
          Assert-Has $r @('status=ok', 'host=192.0.2.25', 'host_source=saved', 'bind=198.51.100.16', 'bind_source=cli', 'codec=hevc', 'bitrate_mbps=18')

          # Command-line arguments still win over saved settings.
          $r = Invoke-PrintConfig @('--source-ip', '192.0.2.99', '--bind-ip', '198.51.100.16', '--codec', 'h264', '--bitrate-mbps', '30')
          if ($r.Exit -ne 0) { throw "exit $($r.Exit)" }
          Assert-Has $r @('status=ok', 'host=192.0.2.99', 'host_source=cli', 'codec=h264', 'bitrate_mbps=30')

          # No saved host: the viewer asks for setup (exit 3, no dialog with --print-config).
          Remove-ItemProperty -Path $key -Name HostIp
          $r = Invoke-PrintConfig @()
          if ($r.Exit -ne 3) { throw "expected exit 3, got $($r.Exit)" }
          Assert-Has $r @('status=needs-setup')
          Remove-Item -Path $key -Recurse -Force
