name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: personal/windows-client
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (unsigned)
        run: cmake --build build --config Release --target Jerislink
      - uses: actions/upload-artifact@v4
        with:
          name: jerislink-windows-unsigned
          path: personal/windows-client/build/Release/Jerislink.exe
      - name: Build settings UI snapshot (CI only, not packaged)
        run: cmake --build build --config Release --target JerislinkUiSnapshot
      - name: UI snapshots and no-freeze checks (launch screen, overlay, settings, volume)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Jeris\Jerislink'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name HostIp -Value '100.64.0.10' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoCodec -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoBitrateMbps -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name AudioVolumePercent -Value 70 -PropertyType DWord -Force | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'ui-snapshots'
          $codes = @{}
          foreach ($accent in 'green', 'blue') {
            $dir = Join-Path $root $accent
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $log = Join-Path $dir 'snapshot.txt'
            $p = Start-Process build\Release\JerislinkUiSnapshot.exe -ArgumentList $dir, $accent -PassThru -RedirectStandardOutput $log
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "snapshot $accent did not exit" }
            Get-Content $log -ErrorAction SilentlyContinue
            $codes[$accent] = $p.ExitCode
          }
          Remove-Item -Path $key -Recurse -Force
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem $root -Recurse -Filter *.bmp | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "$($_.Directory.Name)/$($_.Name) $($img.Width)x$($img.Height)"
            $img.Dispose()
            Remove-Item $_.FullName
          }
          foreach ($accent in $codes.Keys) {
            if ($codes[$accent] -ne 0) { throw "snapshot $accent exit $($codes[$accent])" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: jerislink-ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
      - name: Build overlay unit test
        run: cmake --build build --config Release --target JerislinkOverlayTest
      - name: Overlay unit test (layout, hit-test, keyboard focus, slider, hover dwell)
        run: build\Release\JerislinkOverlayTest.exe
      - name: Build launch-config unit test
        run: cmake --build build --config Release --target JerislinkOptionsTest
      - name: Launch-config unit test
        run: build\Release\JerislinkOptionsTest.exe
      - name: Build receiver / NACK unit test
        run: cmake --build build --config Release --target JerislinkReceiverTest
      - name: Receiver / NACK unit test (loss simulation, NACK on vs off)
        run: build\Release\JerislinkReceiverTest.exe
      - name: Build loop wait test
        run: cmake --build build --config Release --target JerislinkLoopWaitTest
      - name: Loop wait test (MRM1 wake, timer period before/after)
        run: build\Release\JerislinkLoopWaitTest.exe
      - name: Build viewer log test
        run: cmake --build build --config Release --target JerislinkLogTest
      - name: Viewer log test (order, size caps, legacy history trim, caller cost before/after)
        run: build\Release\JerislinkLogTest.exe
      - name: Build mouse button parity test
        run: cmake --build build --config Release --target JerislinkMouseButtonsTest
      - name: Mouse button parity test (every down gets one up; focus kill, capture lost)
        run: build\Release\JerislinkMouseButtonsTest.exe
      - name: Build H.264 NAL summary test
        run: cmake --build build --config Release --target JerislinkNalSummaryTest
      - name: H.264 NAL summary test (slice first_mb / type, Annex B split, log budget)
        run: build\Release\JerislinkNalSummaryTest.exe
      - name: Build keymap golden test
        run: cmake --build build --config Release --target JerislinkKeymapTest
      - name: Keymap golden test (Mac and Windows presets, Ctrl+A/C/V/X/Z/S/F, Ctrl+Y redo, Win+C / Win+Space, Alt+Tab, viewer hotkeys, focus-loss release, live preset switch)
        run: build\Release\JerislinkKeymapTest.exe
      - name: Build file wire codec test
        run: cmake --build build --config Release --target JerislinkFileProtoTest
      - name: Build received-path safety test
        run: cmake --build build --config Release --target JerislinkFilePathTest
      - name: File wire codec test (0x50-0x5C round trip, strict lengths, byte layout shared with the Mac host)
        run: build\Release\JerislinkFileProtoTest.exe
      - name: Received-path safety test (traversal, absolute, drive, reserved names and chars, NFC, length and depth limits, clash names)
        run: build\Release\JerislinkFilePathTest.exe
      - name: Build paste upload test
        run: cmake --build build --config Release --target JerislinkFileUploadTest
      - name: Paste upload test (Cmd+V hold in both presets, 3 s window, focus loss, pacer, chip and confirm text, confirm keys)
        run: build\Release\JerislinkFileUploadTest.exe
      - name: No always-on shortcut or key log lines in the viewer
        shell: pwsh
        run: |
          $hits = Select-String -Path viewer.cpp -Pattern 'logLine\("(shortcut\.|key\.)'
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw "shortcut/key log lines must go through sendKeyOutput (JERISLINK_DEBUG=1 only)" }
          Write-Host "OK: no direct shortcut./key. log lines in viewer.cpp"
      - name: Build audio jitter test
        run: cmake --build build --config Release --target JerislinkAudioTest
      - name: Audio jitter test (MRA1 v1/v2 parse, Opus round trip, PLC, FEC, drift control, A1 vs A2 link simulation)
        run: build\Release\JerislinkAudioTest.exe
      - name: Saved settings drive a launch without connection arguments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Jeris\Jerislink'
          $exe = (Resolve-Path build\Release\Jerislink.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'jerislink-config.txt'
          function Invoke-PrintConfig([string[]]$extra) {
            Remove-Item $out -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList ($extra + @('--print-config', $out)) -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Jerislink.exe did not exit (dialog shown?)' }
            $text = Get-Content $out -Raw
            Write-Host "args: $extra exit: $($p.ExitCode)"; Write-Host $text
            return @{ Exit = $p.ExitCode; Text = $text }
          }
          function Assert-Has($r, [string[]]$lines) {
            foreach ($l in $lines) { if ($r.Text -notmatch "(?m)^$([regex]::Escape($l))\r?$") { throw "missing '$l'" } }
          }
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name HostIp -Value '192.0.2.25' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name BindIp -Value '198.51.100.16' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoCodec -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name VideoBitrateMbps -Value 18 -PropertyType DWord -Force | Out-Null

          # Only the diagnostic flag: everything comes from the saved settings.
          $r = Invoke-PrintConfig @()
          if ($r.Exit -ne 0) { throw "exit $($r.Exit)" }
          Assert-Has $r @('status=ok', 'host=192.0.2.25', 'host_source=saved', 'bind=198.51.100.16', 'bind_source=saved', 'codec=hevc', 'bitrate_mbps=18')

          # Command-line arguments still win over saved settings.
          $r = Invoke-PrintConfig @('--source-ip', '192.0.2.99', '--codec', 'h264', '--bitrate-mbps', '30')
          Assert-Has $r @('status=ok', 'host=192.0.2.99', 'host_source=cli', 'codec=h264', 'bitrate_mbps=30')

          # No saved host: the viewer asks for setup (exit 3, no dialog with --print-config).
          Remove-ItemProperty -Path $key -Name HostIp
          $r = Invoke-PrintConfig @()
          if ($r.Exit -ne 3) { throw "expected exit 3, got $($r.Exit)" }
          Assert-Has $r @('status=needs-setup')
          Remove-Item -Path $key -Recurse -Force
